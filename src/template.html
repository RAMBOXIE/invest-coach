<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141b36">
<title>投资教练</title>
<!--
  invest-coach 前端 v2「判卷台」（单文件，手机优先）。
  图谱布局/解锁思路源自 agent-graph-learning 的 learn-map template
  （MIT License, Copyright (c) 2026 Lichangfocus，见仓库 NOTICE.md）。
  形态规格见 docs/形态规格_v2_判卷台.md。
  判分永远是本文件内的规则引擎；LLM 不判分、不读用户自由文本（v3 §2.6 + 裁决 5）。
-->
<style>
  :root{
    --bg1:#141b36; --bg2:#232e52; --card:#fdf9f0; --ink:#37304d; --soft:#6f688a;
    --gold:#ffd166; --good:#4fbf85; --bad:#e2606c; --na:#5aa9e6; --violet:#8646b8;
    --line:#e2d8c4; --tap:48px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1) 70%);
    background-attachment:fixed;color:#f2ecdd;min-height:100dvh;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .app{max-width:560px;margin:0 auto;padding:0 14px calc(84px + env(safe-area-inset-bottom))}
  /* 顶栏 */
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 2px 8px;position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--bg1) 70%,transparent)}
  .top .tt{font-size:12px;letter-spacing:2px;color:var(--gold)}
  .top h1{font-size:17px;margin:2px 0 0;font-weight:700}
  .coachbtn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);
    border-radius:999px;padding:8px 12px;font-size:13px;min-height:40px}
  /* 通用卡 */
  .sec{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
    border-radius:16px;padding:14px;margin:10px 0}
  .sec h2{font-size:13px;margin:0 0 8px;color:var(--gold);letter-spacing:1px;font-weight:600}
  .big{background:linear-gradient(150deg,rgba(255,209,102,.14),rgba(134,70,184,.14));
    border:1px solid rgba(255,209,102,.3)}
  .big .code{font-size:11px;letter-spacing:2px;color:var(--gold)}
  .big h3{font-size:20px;margin:6px 0 4px;line-height:1.35}
  .big p{font-size:14px;line-height:1.65;color:#d9d2ea;margin:6px 0 12px}
  .cta{display:block;width:100%;min-height:var(--tap);background:var(--gold);color:#2a2010;
    border-radius:14px;font-size:16px;font-weight:700}
  .cta.ghost{background:rgba(255,255,255,.1);color:#f2ecdd}
  .cta:disabled{opacity:.4}
  .rowbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    border-radius:14px;padding:11px 13px;margin-bottom:7px;min-height:var(--tap)}
  .rowbtn .ic{font-size:20px;width:26px;text-align:center}
  .rowbtn .nm{font-weight:600;font-size:14.5px}
  .rowbtn .mt{font-size:11.5px;color:#a49cc4;margin-top:1px}
  .rowbtn[disabled]{opacity:.42}
  .chipS{margin-left:auto;font-size:11px;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .chipS.lit{background:rgba(79,191,133,.22);color:#8fe0b4}
  .chipS.open{background:rgba(255,209,102,.2);color:var(--gold)}
  .chipS.locked{background:rgba(255,255,255,.08);color:#9a93b5}
  .chipS.due{background:rgba(226,96,108,.28);color:#ffb3ba}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .st{background:rgba(255,255,255,.06);border-radius:12px;padding:9px;text-align:center}
  .st .v{font-size:19px;font-weight:700}
  .st .k{font-size:10.5px;color:#a49cc4;margin-top:1px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    background:rgba(16,20,42,.97);border-top:1px solid rgba(255,255,255,.1);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;padding:9px 0 8px;font-size:10.5px;color:#8c85ad;min-height:var(--tap)}
  .tabbar button .i{display:block;font-size:19px;margin-bottom:1px}
  .tabbar button.on{color:var(--gold)}
  .foot{font-size:10.5px;color:#7b749b;text-align:center;line-height:1.6;padding:14px 4px 4px}
  /* 全屏课节 */
  .stage{position:fixed;inset:0;z-index:40;background:var(--card);color:var(--ink);
    display:none;flex-direction:column}
  .stage.show{display:flex}
  .sbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
    border-bottom:1px solid var(--line);flex:none}
  .sbar .x{font-size:15px;color:var(--soft);min-height:40px;padding:0 6px}
  .prog{flex:1;height:6px;border-radius:3px;background:#e8dfcc;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--violet);transition:width .3s}
  .sbar .n{font-size:12px;color:var(--soft)}
  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 8px}
  .foot2{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--card)}
  .step-t{font-size:11px;letter-spacing:2px;color:var(--violet);font-weight:700}
  .body h3{font-size:18px;margin:6px 0 10px;line-height:1.4}
  .body p{font-size:15px;line-height:1.75;margin:9px 0}
  .prompt{font-size:16px;font-weight:600;line-height:1.6;margin:4px 0 12px}
  /* 对照卡（替代表格） */
  .cmp{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0}
  .cmp .hd{display:grid;grid-template-columns:1.15fr 1fr 1fr;background:#f3ead6;
    font-size:11.5px;font-weight:700;color:var(--soft)}
  .cmp .hd>*{padding:8px 6px;text-align:center}
  .cmp .hd>*:first-child{text-align:left;padding-left:12px}
  .cmp .rw{display:grid;grid-template-columns:1.15fr 1fr 1fr;border-top:1px solid var(--line);font-size:14px}
  .cmp .rw>*{padding:9px 6px;text-align:center}
  .cmp .rw>*:first-child{text-align:left;padding-left:12px;color:var(--soft);font-size:12.5px}
  .cmp .hl{font-weight:700;color:var(--bad)}
  .cmp .ok{color:#2e9c68}
  .src{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--violet);
    background:#f0e8fa;border-radius:999px;padding:4px 9px;margin:2px 4px 2px 0;min-height:30px}
  /* 案卷 */
  .cfhead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 0 8px}
  .cfcode{font-size:11px;letter-spacing:1.5px;color:var(--violet);font-weight:700}
  .cfstat{font-size:10.5px;border-radius:999px;padding:2px 8px}
  .cfstat.set{background:#e8f8ef;color:#2e9c68}
  .cfstat.ask{background:#fff2d9;color:#a5761b}
  .cfstat.tea{background:#eee;color:#777}
  .cfas{font-size:11px;color:var(--soft);margin-left:auto}
  .cfbrief{font-size:15.5px;line-height:1.7;font-weight:600;margin:2px 0 12px}
  .cfnote{font-size:13.5px;line-height:1.7;color:var(--soft);background:#f6f1e2;
    border-radius:10px;padding:9px 11px;margin:9px 0}
  .cq{margin:10px 0;padding:11px 13px;background:#f3ead6;border-left:3px solid var(--violet);
    border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.75}
  .cq cite{display:block;margin-top:6px;font-size:11.5px;color:var(--soft);font-style:normal}
  .cfdis{font-size:11px;line-height:1.6;color:var(--soft);border-top:1px dashed var(--line);
    padding-top:8px;margin-top:12px}
  .srcrow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
  a.src{text-decoration:none}
  .labcard{background:linear-gradient(150deg,rgba(90,169,230,.14),rgba(255,255,255,.05));
    border:1px solid rgba(90,169,230,.35)}
  .labtag{font-size:10.5px;background:rgba(90,169,230,.25);color:#bfe0ff;
    border-radius:999px;padding:2px 8px;margin-left:6px}
  /* 证据 chip */
  .cards{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .card-c{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;
    font-size:14px;line-height:1.45;text-align:left;min-height:44px;flex:1 1 100%}
  .card-c.on{border-color:var(--violet);background:#f4ecff;font-weight:600}
  .card-c .tag{float:right;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px}
  .card-c.rev-support .tag{background:#dff5e8;color:#2e9c68}
  .card-c.rev-distractor .tag{background:#fde8ea;color:#c4485a}
  .card-c.rev-irrelevant .tag{background:#eee;color:#888}
  /* 排除步 */
  .ro{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:9px 0;background:#fff}
  .ro .t{font-size:14px;line-height:1.55;margin-bottom:9px}
  .ro .opts{display:flex;gap:6px}
  .ro .opts button{flex:1;border:2px solid var(--line);border-radius:10px;padding:8px 4px;
    font-size:12.5px;min-height:42px;background:#fdfbf6}
  .ro .opts button.on{border-color:var(--violet);background:#f4ecff;font-weight:700}
  .ro .fb{font-size:12.5px;line-height:1.6;color:var(--soft);margin-top:8px;
    background:#f6f1e2;border-radius:9px;padding:7px 9px}
  /* 结论与信心 */
  .opt{display:block;width:100%;text-align:left;font-size:15px;line-height:1.55;background:#fff;
    border:2px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:8px;
    color:var(--ink);min-height:var(--tap)}
  .opt.on{border-color:var(--violet);background:#f4ecff}
  .opt.right{border-color:var(--good);background:#e8f8ef}
  .opt.wrong{border-color:var(--bad);background:#fbe9ea}
  .opt.naf{border-color:var(--na);background:#e9f3fc}
  .seg{display:flex;gap:0;border:2px solid var(--line);border-radius:13px;overflow:hidden;margin:8px 0}
  .seg button{flex:1;padding:11px 4px;font-size:13px;background:#fff;color:var(--ink);
    border-right:1px solid var(--line);min-height:var(--tap)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--violet);color:#fff;font-weight:700}
  /* 反馈 */
  .fb{font-size:14px;line-height:1.7;background:#fff7e0;border-radius:12px;padding:11px 13px;margin:10px 0}
  .fb.good{background:#e8f8ef}
  .coach{display:flex;gap:8px;background:#eef0ff;border-radius:12px;padding:10px 12px;
    font-size:13.5px;line-height:1.6;margin:9px 0}
  .coach .w{font-weight:700;white-space:nowrap}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .attr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px}
  .attr .k{font-size:11px;color:var(--soft)}
  .attr .v{font-size:15px;font-weight:700;margin-top:2px}
  .attr .v.g{color:#2e9c68}.attr .v.b{color:var(--bad)}
  .hintbox{background:#f6f1e2;border-radius:11px;padding:9px 11px;font-size:13.5px;line-height:1.65;margin:8px 0}
  .hintbtn{border:1px solid #cbbf9f;border-radius:999px;padding:8px 14px;font-size:13px;
    color:#8a7a4d;min-height:40px}
  .chk{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:#fff;
    border:2px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;
    font-size:14px;line-height:1.5;color:var(--ink);min-height:var(--tap)}
  .chk.on{border-color:var(--violet);background:#f4ecff}
  .chk .bx{font-size:16px;flex:none}
  .draft{width:100%;min-height:96px;border:2px solid var(--line);border-radius:13px;padding:12px;
    font-size:15px;line-height:1.6;font-family:inherit;color:var(--ink);background:#fff;resize:vertical}
  .tip{font-size:12px;color:var(--soft);line-height:1.6;margin:6px 0}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);color:var(--ink);
    border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(101%);transition:transform .25s;max-height:80dvh;overflow-y:auto;
    box-shadow:0 -8px 30px rgba(0,0,0,.4)}
  .sheet.show{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(8,10,24,.55);z-index:49;display:none}
  .scrim.show{display:block}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);opacity:0;
    background:#221c3a;color:#ffe9b0;padding:11px 18px;border-radius:999px;font-size:14px;
    transition:.25s;z-index:99;pointer-events:none;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .mapmini{width:100%;border-radius:14px;background:rgba(0,0,0,.18);display:block}
  @media(min-width:720px){ .app{max-width:680px} .cta{font-size:17px} }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div><div class="tt" id="tag"></div><h1 id="title"></h1></div>
    <button class="coachbtn" id="coachbtn">🎓 <span id="coachname">教练</span></button>
  </div>
  <div id="view"></div>
  <div class="foot">仅供学习 · 历史案例复盘 · 不构成投资建议，无前瞻信号与收益承诺<br>
    术语与定义来自所列正典出处；通俗解释与教练点评由 AI 起草、经人工核对；判分由页面内置规则完成，AI 不参与判分</div>
</div>

<div class="tabbar">
  <button data-tab="today" class="on"><span class="i">📁</span>今日</button>
  <button data-tab="atlas"><span class="i">🗺️</span>图谱</button>
  <button data-tab="me"><span class="i">📇</span>我</button>
</div>

<div class="stage" id="stage">
  <div class="sbar">
    <button class="x" id="stage-x">✕ 退出</button>
    <span class="prog"><i id="stage-prog"></i></span>
    <span class="n num" id="stage-n"></span>
  </div>
  <div class="body" id="stage-body"></div>
  <div class="foot2" id="stage-foot"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const SITE = /*__DATA__*/null;
const BACKEND = /*__BACKEND__*/null;
if(!SITE){document.body.innerHTML='<p style="padding:40px">数据未注入：请用 tools/build.py 构建。</p>';throw new Error('no data');}

/* ============ 索引 ============ */
const byId=Object.fromEntries(SITE.nodes.map(n=>[n.id,n]));
const COACHES=SITE.x_coaches||[];
const coachById=Object.fromEntries(COACHES.map(c=>[c.id,c]));
const CONF=[{v:.55,t:'没把握'},{v:.75,t:'比较有把握'},{v:.95,t:'很有把握'}];
const NOSCORE=new Set(['case-first-look']);
const PAIRS={};SITE.nodes.forEach(n=>(n.x_pairs||[]).forEach(p=>{if(p.id)PAIRS[p.id]={node:n,look:p.look,key:p.key};}));
const BANK={},BANKQ={};
(SITE.x_review_bank||[]).forEach(it=>{
  (BANK[it.pair_id]=BANK[it.pair_id]||{a:[],b:[]})[it.side].push(it.quiz);
  BANKQ[it.quiz.x_id]={quiz:it.quiz,pair:it.pair_id,side:it.side};
});
const isDeep=n=>!!n.x_level;
function canonLabel(s){s=s||'';
  if(s.includes('Graham'))return'📖 格雷厄姆怎么说';
  if(s.includes('SEC'))return'📖 SEC 怎么认定';
  if(/ASC|IAS|IFRS/.test(s))return'📖 会计准则怎么说';
  if(s.includes('Schilit'))return'📖《财务诡计》怎么说';
  if(s.includes('审计清单'))return'📖 审计研究怎么说';
  return'📖 出处怎么说';}

/* ============ 记忆（零自由文本，规格 §6） ============ */
const KEY='invest-coach:ch1';
const DRAFT=q=>'ic:draft:'+q;               // 先写原文：独立键，不进记忆、不上行
const DAY=864e5;
function fresh(){return{v:2,coach:null,device:'d'+Math.random().toString(36).slice(2)+Date.now().toString(36),
  lit:[],pairs:{},steps:{},anchors:{},answers:{},
  calib:{n:0,sum:0,streak:0,best:0,over:0,under:0},brave:{n:0,dared:0},
  hints:0,reviews:0,gap:{n:0,hits:0},events:[],started:Date.now(),finished:0};}
let S=fresh();
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.v===2)S=Object.assign(fresh(),r);}catch(e){}
let lit=new Set(S.lit.filter(i=>byId[i]));
let lsOK=true;
function save(){S.lit=[...lit];try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){
  if(lsOK){lsOK=false;toast('浏览器不允许保存进度——本次可玩，进度不保留');}}}
function track(t,o){S.events.push(Object.assign({t,ts:Date.now()},o||{}));
  if(S.events.length>400)S.events=S.events.slice(-400);save();}
function flush(){if(!BACKEND||!S.events.length)return;
  try{fetch(BACKEND+'/api/v1/events',{method:'POST',headers:{'Content-Type':'text/plain'},keepalive:true,
    body:JSON.stringify({device:S.device,content_version:SITE.x_version||'',schema_version:2,events:S.events})})
    .then(r=>{if(r.ok){S.events=[];save();}}).catch(()=>{});}catch(e){}}
setInterval(flush,3e4);

/* ============ 教练 ============ */
function coach(){return coachById[S.coach]||COACHES[0];}
const li={};
function line(w){const c=coach();if(!c)return null;
  const ls=(c.style_lines||[]).filter(x=>x.when===w);if(!ls.length)return null;
  li[w]=((li[w]||0)+1)%ls.length;return{who:c.name,t:ls[li[w]].t};}
function coachHTML(w){const l=line(w);return l?`<div class="coach"><span class="w">${l.who}：</span><span>${l.t}</span></div>`:'';}

/* ============ 状态与调度 ============ */
function stateOf(n){if(lit.has(n.id))return'lit';
  return SITE.edges.filter(e=>e.to===n.id&&e.type==='hard').map(e=>e.from).every(p=>lit.has(p))?'open':'locked';}
function ensurePair(p){if(!S.pairs[p])S.pairs[p]={seen:0,wrong:0,hl:1,due:Date.now()+DAY,lastSide:null,lastWrong:null};return S.pairs[p];}
function duePairs(){const t=Date.now();return Object.keys(S.pairs).filter(p=>PAIRS[p]&&BANK[p]&&S.pairs[p].due<=t);}
function nextNode(){const open=SITE.nodes.filter(n=>stateOf(n)==='open');
  return open.sort((a,b)=>(a.ageStart||0)-(b.ageStart||0))[0]||null;}
function brier(){return S.calib.n?Math.round((1-Math.sqrt(S.calib.sum/S.calib.n))*100):null;}
function acc(){const a=Object.values(S.answers).filter(r=>!r.noscore);
  return a.length?Math.round(100*a.filter(r=>r.c).length/a.length):null;}
function braveRate(){return S.brave.n?Math.round(100*S.brave.dared/S.brave.n):null;}

/* ============ 壳渲染 ============ */
let TAB='today';
document.getElementById('tag').textContent=SITE.tag||'';
document.getElementById('title').textContent=SITE.title;
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{
  TAB=b.dataset.tab;document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('on',x===b));
  render();window.scrollTo(0,0);});
document.getElementById('coachbtn').onclick=()=>pickCoach(false);

function render(){
  document.getElementById('coachname').textContent=coach()?coach().name:'教练';
  const v=document.getElementById('view');
  v.innerHTML=TAB==='today'?viewToday():TAB==='atlas'?viewAtlas():viewMe();
  bindView();
}
/* ① 调度器：规则驱动（证据显示个性化排序相对交错无增量，工程预算不压在这里） */
function plan(){
  const dues=duePairs();
  const items=[];
  if(dues.length)items.push({kind:'review',n:dues.length,mins:Math.max(1,Math.round(dues.length*0.5))});
  const weak=Object.entries(S.pairs).filter(([p,a])=>PAIRS[p]&&a.wrong>=2&&a.due>Date.now())

  const nx=nextNode();
  if(nx)items.push({kind:'node',node:nx,mins:isDeep(nx)?6:3});
  if(weak)items.push({kind:'weak',pair:weak[0],wrong:weak[1].wrong});
  if((SITE.x_lab||{}).cases||[])items.push({kind:'lab'});
  return {items,dues,nx,weak};
}

function miniMap(){
  const L={};SITE.nodes.forEach(n=>{const l=n.ageStart||1;(L[l]=L[l]||[]).push(n);});
  const maxL=Math.max(...Object.keys(L).map(Number));
  const W=320,H=190;let dots='',lines='';
  const pos={};
  Object.entries(L).forEach(([l,arr])=>arr.forEach((n,i)=>{
    pos[n.id]={x:18+(W-36)*(l-1)/(maxL-1||1),y:arr.length===1?H/2:22+(H-44)*i/(arr.length-1)};}));
  SITE.edges.forEach(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return;
    const both=lit.has(e.from)&&lit.has(e.to);
    lines+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${both?'#e9dfae':'#5d668f'}" stroke-width="${both?1.4:1}" opacity="${both?.9:.45}"${e.type!=='hard'?' stroke-dasharray="3 3"':''}/>`;});
  SITE.nodes.forEach(n=>{const p=pos[n.id],st=stateOf(n);
    dots+=`<circle cx="${p.x}" cy="${p.y}" r="${st==='lit'?5:4}" fill="${st==='lit'?'#ffd166':st==='open'?'#8fa0d8':'#4a5378'}"/>`;});
  return `<svg class="mapmini" viewBox="0 0 ${W} ${H}">${lines}${dots}</svg>`;
}

const FACTS={};   // 溯源徽标 → 事实条目（构建期由 facts.json 注入 SITE，运行时兜底用 srcs 文本）
function cfHTML(cf,opts){
  opts=opts||{};
  let h=`<div class="cfhead"><span class="cfcode">${cf.code||'案卷'}</span>`;
  if(cf.status==='regulator_asked')h+=`<span class="cfstat ask">监管已问询</span>`;
  else if(cf.status==='settled')h+=`<span class="cfstat set">已认定</span>`;
  else h+=`<span class="cfstat tea">教学构造</span>`;
  if(cf.asof)h+=`<span class="cfas">${cf.asof}</span>`;
  h+=`</div><p class="cfbrief">${cf.brief||''}</p>`;
  for(const pn of cf.panels||[]){
    if(pn.kind==='cmp'){
      const two=(pn.cols||[]).filter(Boolean).length>1;
      h+=`<div class="cmp"><div class="hd" style="${two?'':'grid-template-columns:1.3fr 1fr'}"><span>${pn.title||''}</span>
        <span>${(pn.cols||[''])[0]||''}</span>${two?`<span>${pn.cols[1]}</span>`:''}</div>`;
      for(const r of pn.rows||[]){
        h+=`<div class="rw" style="${two?'':'grid-template-columns:1.3fr 1fr'}"><span>${r.k}</span>
          <span class="num ${r.flagA?'hl':''}">${r.a||''}</span>${two?`<span class="num ${r.flagB?'hl':''} ${r.okB?'ok':''}">${r.b||''}</span>`:''}</div>`;
      }
      h+=`</div>`;
    } else if(pn.kind==='trend'){
      h+=`<div class="cmp"><div class="hd" style="grid-template-columns:1.2fr repeat(3,1fr)"><span>${pn.title||''}</span><span>第1年</span><span>第2年</span><span>第3年</span></div>`;
      for(const s of pn.series||[]){
        h+=`<div class="rw" style="grid-template-columns:1.2fr repeat(3,1fr)"><span>${s.k}</span>`+
           (s.v||[]).map(v=>`<span class="num ${s.flag?'hl':''}">${v}</span>`).join('')+`</div>`;
      }
      h+=`</div>`;
    } else if(pn.kind==='quote'){
      h+=`<blockquote class="cq">${pn.t}<cite>${pn.src||''}</cite></blockquote>`;
    } else {
      h+=`<p class="cfnote">${pn.t}</p>`;
    }
  }
  if((cf.srcs||[]).length)
    h+=`<div class="srcrow">${cf.srcs.map(s=>`<button class="src" data-src="${s.f}">🔗 ${s.t}</button>`).join('')}</div>`;
  if(cf.letter)h+=`<div class="srcrow"><a class="src" href="${cf.letter.url}" target="_blank" rel="noopener">📄 SEC 问询函 · ${cf.letter.filed}</a></div>`;
  if(cf.disclaimer)h+=`<p class="cfdis">${cf.disclaimer}</p>`;
  if(opts.teach)h+=`<button class="hintbtn" id="cf-teach" style="margin-top:10px">📚 补课：这一节的概念讲解</button>`;
  return h;
}

    bind(){const t=document.getElementById('st-draft');
      try{t.value=localStorage.getItem(k)||'';}catch(e){}
      t.oninput=()=>{try{localStorage.setItem(k,t.value);}catch(e){}};
      document.getElementById('st-skip').onclick=()=>{R.step++;drawStage();};}};
}

/* — 拍 3 挑证据 — */
function cd(){
  const cards=R.node.x_cards||[];
  const body=`<div class="step-t">第 ${R.steps.indexOf('cards')} 步 · 挑证据</div>
    <p class="prompt">从材料里挑出你依据的那几条。挑对不挑多。</p>
    <div class="cards">${cards.map(c=>`<button class="card-c${R.cards.has(c.id)?' on':''}" data-c="${c.id}">${c.t}</button>`).join('')}</div>
    <div class="tip">已选 <b class="num" id="cnt">${R.cards.size}</b> 条。这一步不判对错，但它会成为你推理链的骨架。</div>`;
  return{body,foot:`<div style="display:flex;gap:8px">
      <button class="cta ghost" id="st-back" style="flex:0 0 30%">上一步</button>
      <button class="cta" id="st-next" ${R.cards.size?'':'disabled'}>选好了</button></div>`,
    bind(){SB().querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.c;R.cards.has(id)?R.cards.delete(id):R.cards.add(id);drawStage();});}};
}

/* — 拍 4 排除辩护词 — */
function ro(){
  const rs=R.node.x_ruleout||[];
  const L={excluded:'排除了',not_excluded:'没排除',insufficient:'材料不够'};
  const body=`<div class="step-t">第 ${R.steps.indexOf('ruleout')} 步 · 先替它辩护</div>
    <p class="prompt">这些是常见的无辜解释。逐条判：材料能不能排除它？</p>
    ${rs.map(r=>{const pick=R.ruleout[r.id];
      return `<div class="ro"><div class="t">${r.t}</div>
      <div class="opts">${Object.keys(L).map(v=>`<button data-r="${r.id}" data-v="${v}" class="${pick===v?'on':''}">${L[v]}</button>`).join('')}</div>
      ${pick?`<div class="fb">${pick===r.verdict?'✓ ':'△ '}${r.fb}</div>`:''}</div>`;}).join('')}`;
  const all=rs.every(r=>R.ruleout[r.id]);
  return{body,foot:`<div style="display:flex;gap:8px">
      <button class="cta ghost" id="st-back" style="flex:0 0 30%">上一步</button>
      <button class="cta" id="st-next" ${all?'':'disabled'}>判完了</button></div>`,
    bind(){SB().querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
      R.ruleout[b.dataset.r]=b.dataset.v;drawStage();});}};
}

/* — 拍 5 下结论（规则引擎判分） — */
function cc(){
  const q=R.quiz;
  if(!q)return{body:'<p>本节点无判定题。</p>',foot:`<button class="cta" id="st-next">继续</button>`};
  const needConf=!!q.confidence, picked=R.conf!=null;
  let body=`<div class="step-t">第 ${R.steps.indexOf('conclude')} 步 · 下结论${R.mainQ.length>1?`（${R.quizIdx+1}/${R.mainQ.length}）`:''}</div><p class="prompt">${q.q}</p>`;
  if(needConf){
    body+=`<div class="tip">先标注把握（进校准分，诚实最划算）：</div>
      <div class="seg">${CONF.map(c=>`<button data-cf="${c.v}" class="${R.conf===c.v?'on':''}" ${R.done?'disabled':''}>${c.t}</button>`).join('')}</div>`;
  }
  const lock=R.done||(needConf&&!picked);
  body+=q.opts.map((o,i)=>{
    let cls='';
    if(R.done&&o.ok)cls=' right';else if(R.tried.has(i)&&!o.ok)cls=o.na?' naf':' wrong';
    return `<button class="opt${cls}" data-o="${i}" ${lock||R.tried.has(i)?'disabled':''}>${o.t}</button>`;}).join('');
  if(R.fb)body+=`<div class="fb${R.fbGood?' good':''}">${R.fb}</div>`;
  if(R.cl)body+=`<div class="coach"><span class="w">${R.cl.who}：</span><span>${R.cl.t}</span></div>`;
  if(!R.done&&(q.hints||[]).length){
    body+=`<button class="hintbtn" id="st-hint">💡 提示（${R.hint}/${q.hints.length}）</button>`;
    if(R.hint)body+=`<div class="hintbox">${q.hints.slice(0,R.hint).map((h,i)=>`${'①②③'[i]} ${h}`).join('<br>')}</div>`;
  }
  const more=R.quizIdx<R.mainQ.length-1;
  return{body,foot:`<button class="cta" id="${more?'st-nextq':'st-next'}" ${R.done?'':'disabled'}>${more?'下一题':(R.deep?'继续':'去锚题')}</button>`,
    bind(){
      SB().querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{R.conf=+b.dataset.cf;drawStage();});
      const hb=document.getElementById('st-hint');
      if(hb)hb.onclick=()=>{if(R.hint<(q.hints||[]).length){R.hint++;S.hints++;save();}drawStage();};
      SB().querySelectorAll('[data-o]:not([disabled])').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.o,o=q.opts[i],first=!R.tried.size&&!S.answers[q.x_id];
        R.tried.add(i);
        if(o.ok){R.done=true;R.fb=q.fb;R.fbGood=true;R.concl=i;}
        else if(q.x_kind==='pretest'){R.done=true;R.fb=q.fb;R.fbGood=false;R.concl=i;}
        else{R.fb=o.na?'这题的证据其实够了——回头看看材料，够在哪？':'不对——要不要点一级提示？';R.fbGood=false;}
        R.cl=line(o.na&&o.ok?'na_honest':o.na?'na_dodge':!o.ok&&R.conf===.95?'overconfident':!o.ok?'wrong':R.hint?'hint_used':'correct');
        if(first)recordFirst(q,{c:o.ok?1:0,na:o.na?1:0,naok:(o.na&&o.ok)?1:0,conf:R.conf,h:R.hint,
          k:q.x_kind||'main',ms:Date.now()-R.t0,noscore:NOSCORE.has(R.node.id)?1:0});
        drawStage();});}};
}
/* ① 系统主动触发：不摆「有问题问我」，由规则触发教练介入 */
function maybeIntervene(ctx){
  const c=coach();if(!c)return;
  let why=null,body=null;
  if(ctx.overconf){why='overconfident';
    body=`你刚才标了「很有把握」，但答错了。<b>这正是校准分要治的病</b>——不是知识不够，是把握感和证据不匹配。<br><br>
      下次遇到同类题，先问自己一句：我手上有几条相互独立的证据？只有一条的时候，「比较有把握」就够了。`;}
  else if(ctx.pairRepeat){const pm=PAIRS[ctx.pair];why='pair_repeat';
    body=`你在「${pm.look}」这个对上已经站错 <b>${ctx.wrong}</b> 次了。<br><br>
      区分线索就一句：<b>${pm.key}</b><br><br>这个对会被排到你复训队列的最前面。`;}
  else if(ctx.anchorFail){why='wrong';
    body=`锚题没过——这一节不点亮。<br><br>这不是惩罚：锚题换了公司，考的是你能不能把方法搬到新材料上。回去把案卷和证据链再走一遍，换一道锚题再来。`;}
  if(!why)return;
  const l=line(why);
  document.getElementById('sheet').innerHTML=
    `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
       <span style="font-size:22px">🎓</span><b style="font-size:16px">${c.name}</b>
       <span class="tip" style="margin:0 0 0 auto">教练主动来找你</span></div>
     ${l?`<p style="font-size:15px;line-height:1.7;font-weight:600">${l.t}</p>`:''}
     <p style="font-size:14.5px;line-height:1.75">${body}</p>
     <button class="cta ghost" id="sh-x">知道了</button>`;
  openSheet(true);document.getElementById('sh-x').onclick=closeSheet;
  track('coach_intervene',{why});
}

function recordFirst(q,rec){
  if(S.answers[q.x_id])return;
  S.answers[q.x_id]=rec;
  if(q.confidence&&!rec.noscore){
    const na=(q.opts||[]).find(o=>o.na);
    if(na&&!na.ok){S.brave.n++;if(!rec.na)S.brave.dared++;}
    if(!(rec.na&&!rec.naok)){S.calib.n++;S.calib.sum+=Math.pow(rec.conf-(rec.c?1:0),2);}
    if(rec.conf===.95&&!rec.c&&!rec.na){S.calib.streak=0;S.calib.over++;}
    else if(rec.c){S.calib.streak++;S.calib.best=Math.max(S.calib.best,S.calib.streak);
      if(rec.conf===.55)S.calib.under++;}
  }
  let iv=null;
  if(q.confidence&&!rec.noscore&&rec.conf===.95&&!rec.c&&!rec.na)iv={overconf:1};
  if(q.x_pair&&PAIRS[q.x_pair]){const a=ensurePair(q.x_pair);
    if(!rec.c&&!rec.na&&!rec.noscore){a.wrong++;a.lastWrong=rec.side||'node';
      if(a.wrong>=2)iv={pairRepeat:1,pair:q.x_pair,wrong:a.wrong};}}
  if(iv)setTimeout(()=>maybeIntervene(iv),650);
  track('first_answer',{quiz_id:q.x_id,pair_id:q.x_pair||null,side:rec.side||null,kind:rec.k,
    correct:rec.c,na:rec.na,conf:rec.conf||null,hints:rec.h,latency:rec.ms});
  save();
}

/* — 拍 6 自评对照（闭集，产生 hindsight gap） — */
function sf(){
  const sc=R.node.x_selfcheck||[];
  const body=`<div class="step-t">第 ${R.steps.indexOf('self')} 步 · 自评</div>
    <p class="prompt">诚实勾选：刚才判卷时，你真的想到了哪几条？</p>
    ${sc.map(s=>`<button class="chk${R.self.has(s.id)?' on':''}" data-s="${s.id}">
      <span class="bx">${R.self.has(s.id)?'☑':'☐'}</span><span>${s.t}</span></button>`).join('')}
    <div class="tip">这一步不判分。它和你上一步实际挑的证据一对撞，就得到「事后诸葛率」——想到了但没写进链子的比例。</div>`;
  return{body,foot:`<button class="cta" id="st-next">对照专家链</button>`,
    bind(){SB().querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.s;R.self.has(id)?R.self.delete(id):R.self.add(id);drawStage();});}};
}

/* — 拍 7 批注回卷（四个可计算属性，规则引擎算） — */
function rv(){
  const n=R.node,cards=n.x_cards||[];
  const sup=cards.filter(c=>c.role==='support'), dis=cards.filter(c=>c.role!=='support');
  const hit=sup.filter(c=>R.cards.has(c.id)).length;
  const bad=dis.filter(c=>R.cards.has(c.id)).length;
  const cover=sup.length?Math.round(100*hit/sup.length):0;
  const roN=(n.x_ruleout||[]).length;
  const roOK=(n.x_ruleout||[]).filter(r=>R.ruleout[r.id]===r.verdict).length;
  const consist=R.conf==null?null:(R.conf>=.95&&hit<Math.ceil(sup.length*.6))?'偏高':(R.conf<=.55&&hit>=sup.length)?'偏低':'匹配';
  // hindsight gap：自评说想到了，但证据链里没有
  const scN=(n.x_selfcheck||[]).length;
  const gapN=Math.max(0,R.self.size-hit);
  if(!R.logged){S.gap.n+=R.self.size||0;S.gap.hits+=gapN;
    const st=S.steps[n.id]=S.steps[n.id]||{ev:{n:0,hit:0,bad:0},ro:{n:0,ok:0}};
    st.ev.n++;st.ev.hit+=hit;st.ev.bad+=bad;st.ro.n+=roN;st.ro.ok+=roOK;
    R.logged=true;track('step_review',{node:n.id,cover,bad,ro_ok:roOK,gap:gapN});save();}
  const body=`<div class="step-t">第 ${R.steps.indexOf('review')} 步 · 回卷</div>
    <p class="prompt">这不是分数，是关于你这份判卷的四个事实。</p>
    <div class="attrs">
      <div class="attr"><div class="k">覆盖</div><div class="v num ${cover>=60?'g':'b'}">${cover}%</div></div>
      <div class="attr"><div class="k">干扰位</div><div class="v num ${bad?'b':'g'}">${bad} 条</div></div>
      <div class="attr"><div class="k">辩护词判准</div><div class="v num ${roN&&roOK===roN?'g':''}">${roN?roOK+'/'+roN:'—'}</div></div>
      <div class="attr"><div class="k">信心一致性</div><div class="v ${consist==='匹配'?'g':'b'}">${consist||'—'}</div></div>
    </div>
    ${bad?`<div class="fb">你挑进链子的「${dis.filter(c=>R.cards.has(c.id)).map(c=>c.t).join('、')}」不支撑结论——它要么是对手方也会有的特征，要么与判断无关。</div>`:''}
    ${gapN?`<div class="fb">事后诸葛：你自评说想到了 ${R.self.size} 条，但推理链里只落实了 ${hit} 条。<b>想到 ≠ 用上</b>——这一条不扣分，但它是判断力最常漏的地方。</div>`:''}
    <div class="fb good"><b>专家链（后置对照）</b><br>${sup.map((c,i)=>`${i+1}. ${c.t}`).join('<br>')}</div>
    <div class="tip">现在回头看看你在第 1 步写的那段话——你自己的推理和这条链差在哪？（那段话没有离开过你的手机）</div>
    ${coachHTML(cover>=60?'correct':'wrong')}`;
  return{body,foot:`<button class="cta" id="st-next">去闭卷锚题</button>`};
}

/* — 锚题：唯一的点亮条件 — */
function an(){
  if(!R.anchor){
    const ids=(R.node.x_anchors||[]).filter(i=>BANKQ[i]);
    const seen=(S.anchors[R.node.id]||{}).seen||[];
    const fresh=ids.filter(i=>!seen.includes(i));
    const pool=fresh.length?fresh:ids;                     // 优先没见过的；用尽则轮换
    const pick=pool.length?pool[(S.anchors[R.node.id]?.attempts||0)%pool.length]:null;
    R.anchor=pick?{...BANKQ[pick]}:null;
    R.aTried=new Set();R.aDone=false;R.aPass=false;R.aConf=null;R.aFb=null;
  }
  if(!R.anchor&&(R.node.x_anchors||[]).length){            // 深层节点锚题池异常：绝不放行点亮
    return{body:`<div class="step-t">闭卷锚题</div><h3>锚题暂不可用</h3>
      <p>这一节的锚题库有问题，节点不会被点亮——这是刻意的：<b>点亮只认闭卷锚题</b>。请把这条报给我们。</p>`,
      foot:`<button class="cta ghost" id="st-retry">回去再练一遍</button>`,
      bind(){document.getElementById('st-retry').onclick=()=>{
        R.step=0;R.anchor=null;R.cards=new Set();R.ruleout={};R.self=new Set();R.logged=false;drawStage();};}};
  }
  if(!R.anchor){  // 基础节点（无 x_anchors）：结论即点亮
    return{body:`<div class="step-t">收尾</div><h3>这一节没有闭卷锚题</h3>
      <p>基础概念节点走两拍。判完结论就可以点亮。</p>`,
      foot:`<button class="cta" id="st-light">✨ 点亮它</button>`,
      bind(){document.getElementById('st-light').onclick=()=>lightUp();}};
  }
  const q=R.anchor.quiz;
  let body=`<div class="step-t">闭卷锚题 · 换了一家公司</div>
    <p class="tip">这道题在刚才的判卷里没出现过，也不给提示——<b>它是唯一能点亮节点的一步</b>。答错不惩罚，回去再练就是。</p>
    <p class="prompt">${q.q}</p>
    <div class="seg">${CONF.map(c=>`<button data-af="${c.v}" class="${R.aConf===c.v?'on':''}" ${R.aDone?'disabled':''}>${c.t}</button>`).join('')}</div>`;
  const lock=R.aDone||R.aConf==null;
  body+=q.opts.map((o,i)=>{
    let cls='';if(R.aDone&&o.ok)cls=' right';else if(R.aTried.has(i)&&!o.ok)cls=o.na?' naf':' wrong';
    return `<button class="opt${cls}" data-a="${i}" ${lock||R.aTried.has(i)?'disabled':''}>${o.t}</button>`;}).join('');
  if(R.aFb)body+=`<div class="fb${R.aPass?' good':''}">${R.aFb}</div>`;
  return{body,foot:R.aPass?`<button class="cta" id="st-light">✨ 点亮它</button>`
      :R.aDone?`<button class="cta ghost" id="st-retry">再练一遍这一节</button>`
      :`<button class="cta" disabled>先作答</button>`,
    bind(){
      SB().querySelectorAll('[data-af]').forEach(b=>b.onclick=()=>{R.aConf=+b.dataset.af;drawStage();});
      SB().querySelectorAll('[data-a]:not([disabled])').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.a,o=q.opts[i];R.aTried.add(i);
        const a=S.anchors[R.node.id]=S.anchors[R.node.id]||{attempts:0,seen:[]};
        a.attempts++;if(!a.seen.includes(R.anchor.quiz.x_id))a.seen.push(R.anchor.quiz.x_id);
        if(o.ok){R.aDone=true;R.aPass=true;R.aFb='✓ '+q.fb;a.passed_at=Date.now();}
        else{R.aDone=true;R.aPass=false;R.aFb=q.fb+'<br><br><b>这一节还没点亮</b>——不扣分，回去把材料和证据链再走一遍，换一道锚题再来。';
          setTimeout(()=>maybeIntervene({anchorFail:1}),650);}
        if(R.anchor.pair){const p=ensurePair(R.anchor.pair);p.seen++;p.lastSide=R.anchor.side;
          if(o.ok)p.hl=Math.min(64,p.hl*2);else{p.hl=Math.max(.5,p.hl/2);p.wrong++;p.lastWrong=R.anchor.side;}
          p.due=Date.now()+p.hl*DAY;}
        recordFirst(q,{c:o.ok?1:0,na:o.na?1:0,naok:(o.na&&o.ok)?1:0,conf:R.aConf,h:0,k:'anchor',
          side:R.anchor.side,ms:0,noscore:0});
        track('anchor_answer',{node:R.node.id,quiz_id:q.x_id,correct:o.ok?1:0,attempts:a.attempts});
        save();drawStage();});
      const rt=document.getElementById('st-retry');
      if(rt)rt.onclick=()=>{R.step=0;R.anchor=null;R.cards=new Set();R.ruleout={};R.self=new Set();R.logged=false;drawStage();};
      const lb=document.getElementById('st-light');
      if(lb)lb.onclick=()=>lightUp();}};
}
function lightUp(){
  const n=R.node;lit.add(n.id);save();track('node_lit',{node:n.id});
  const unlocked=SITE.nodes.filter(x=>!lit.has(x.id)&&stateOf(x)==='open').map(x=>x.name);
  const done=lit.size===SITE.nodes.length;
  if(done&&!S.finished){S.finished=Date.now();save();track('chapter_complete',{});}
  document.getElementById('stage-body').innerHTML=
    `<div style="text-align:center;padding:22px 4px"><div style="font-size:46px">✨${n.icon}✨</div>
      <h3>「${n.name}」点亮了</h3>
      <p class="tip">你是靠一道闭卷题点亮它的——不是靠看完材料。</p>
      ${unlocked.length?`<p>新的案卷解锁：${unlocked.join('、')}</p>`:''}
      ${done?`<div class="fb good">第一章全部点亮。接下来靠复训维持——它比新课更能说明你学会了没有。</div>`:''}
      ${coachHTML(done?'complete':'streak')}</div>`;
  document.getElementById('stage-foot').innerHTML=`<button class="cta" id="st-done">回到今日</button>`;
  document.getElementById('stage-prog').style.width='100%';
  document.getElementById('st-done').onclick=()=>{stage.classList.remove('show');R=null;render();flush();};
}

/* ============ ② 时事案卷（实验室，不计分） ============ */
function openLab(){
  const lc=((SITE.x_lab||{}).cases||[])[0];if(!lc)return;
  R={mode:'lab',case:lc,step:0,tried:new Set(),done:false};
  stage.classList.add('show');track('lab_open',{case:lc.id});drawLab();
}
function drawLab(){
  const lc=R.case;
  document.getElementById('stage-prog').style.width=(R.step?100:50)+'%';
  document.getElementById('stage-n').textContent=(R.step+1)+'/2';
  const b=SB(),f=document.getElementById('stage-foot');
  if(R.step===0){
    b.innerHTML=`<div class="step-t">时事案卷 · 实验室</div>${cfHTML(lc,{})}
      <p class="cfnote">这一卷的边界：<b>只读数字的形状，不对这家公司下任何定性判断</b>。监管问了什么、公司怎么答，才是要读的东西。</p>`;
    f.innerHTML=`<button class="cta" id="lab-next">看完了</button>`;
    b.querySelectorAll('[data-src]').forEach(x=>x.onclick=()=>showFact(x.dataset.src));
    document.getElementById('lab-next').onclick=()=>{R.step=1;drawLab();};
    return;
  }
  const q=lc.quiz;
  let h=`<div class="step-t">读数题 · 不计分</div><p class="prompt">${q.q}</p>`;
  h+=q.opts.map((o,i)=>{let c='';
    if(R.done&&o.ok)c=' right';else if(R.tried.has(i)&&!o.ok)c=' wrong';
    return `<button class="opt${c}" data-l="${i}" ${R.done||R.tried.has(i)?'disabled':''}>${o.t}</button>`;}).join('');
  if(R.fb)h+=`<div class="fb${R.done?' good':''}">${R.fb}</div>`;
  if(R.done)h+=`<div class="cfnote">这一卷不计入你的任何成绩——它由管线自动产出、还没人签字。<br>
    管线：${lc.provenance.computed_by}<br>取数标签：${lc.provenance.tags.revenue} / ${lc.provenance.tags.receivables}</div>`;
  b.innerHTML=h;
  f.innerHTML=`<button class="cta" id="lab-x" ${R.done?'':'disabled'}>回到今日</button>`;
  b.querySelectorAll('[data-l]:not([disabled])').forEach(x=>x.onclick=()=>{
    const i=+x.dataset.l,o=q.opts[i];R.tried.add(i);
    if(o.ok){R.done=true;R.fb=q.fb;}else{R.fb='再看一眼两行数字的相对关系。';}
    track('lab_answer',{case:lc.id,correct:o.ok?1:0});drawLab();});
  const bx=document.getElementById('lab-x');
  if(bx)bx.onclick=()=>{stage.classList.remove('show');R=null;render();flush();};
}

/* ============ 复训 ============ */
function startReview(){
  const dues=duePairs();if(!dues.length)return toast('没有到期的复训 ✓');
  R={mode:'review',queue:dues.map(p=>{const a=ensurePair(p);
      let side=a.lastWrong==='a'||a.lastWrong==='b'?a.lastWrong:(a.lastSide==='a'?'b':'a');
      if(!BANK[p][side]||!BANK[p][side].length)side=side==='a'?'b':'a';
      const list=BANK[p][side];return{pid:p,side,quiz:list[a.seen%list.length]};}),
     qi:0,tried:new Set(),done:false,conf:null,fb:null,ok:0};
  S.reviews++;save();track('review_start',{n:dues.length});
  stage.classList.add('show');drawReview();
}
function drawReview(){
  const it=R.queue[R.qi];
  const b=document.getElementById('stage-body'),f=document.getElementById('stage-foot');
  document.getElementById('stage-prog').style.width=((R.qi+(R.done?1:0))/R.queue.length*100)+'%';
  document.getElementById('stage-n').textContent=(R.qi+1)+'/'+R.queue.length;
  if(!it){
    b.innerHTML=`<div style="text-align:center;padding:22px 4px"><div style="font-size:42px">🔁</div>
      <h3>复训完成 ${R.ok}/${R.queue.length}</h3>
      <p class="tip">答对的对下次来得更晚，答错的对很快再见。</p></div>`;
    f.innerHTML=`<button class="cta" id="rv-x">回到今日</button>`;
    document.getElementById('rv-x').onclick=()=>{stage.classList.remove('show');R=null;render();flush();};
    return;
  }
  const q=it.quiz,pm=PAIRS[it.pid];
  let body=`<div class="step-t">复训 · 闭卷</div>
    <h3 style="font-size:16px">🔁 ${pm?pm.look:it.pid}</h3>
    <p class="prompt">${q.q}</p>
    <div class="seg">${CONF.map(c=>`<button data-cf="${c.v}" class="${R.conf===c.v?'on':''}" ${R.done?'disabled':''}>${c.t}</button>`).join('')}</div>`;
  const lock=R.done||R.conf==null;
  body+=q.opts.map((o,i)=>{let cls='';
    if(R.done&&o.ok)cls=' right';else if(R.tried.has(i)&&!o.ok)cls=o.na?' naf':' wrong';
    return `<button class="opt${cls}" data-o="${i}" ${lock||R.tried.has(i)?'disabled':''}>${o.t}</button>`;}).join('');
  if(R.fb)body+=`<div class="fb${R.fbGood?' good':''}">${R.fb}</div>`;
  if(R.cl)body+=`<div class="coach"><span class="w">${R.cl.who}：</span><span>${R.cl.t}</span></div>`;
  b.innerHTML=body;b.scrollTop=0;
  f.innerHTML=`<button class="cta" id="rv-next" ${R.done?'':'disabled'}>${R.qi+1===R.queue.length?'完成':'下一道'}</button>`;
  SB().querySelectorAll('[data-cf]').forEach(x=>x.onclick=()=>{R.conf=+x.dataset.cf;drawReview();});
  SB().querySelectorAll('[data-o]:not([disabled])').forEach(x=>x.onclick=()=>{
    const i=+x.dataset.o,o=q.opts[i];R.tried.add(i);
    if(o.ok||o.na===undefined&&false){}
    if(o.ok){R.done=true;R.fb=q.fb;R.fbGood=true;R.ok++;}
    else{R.done=true;R.fb=q.fb;R.fbGood=false;}
    R.cl=line(o.na&&o.ok?'na_honest':!o.ok?'pair_repeat':'correct');
    const a=ensurePair(it.pid);a.seen++;a.lastSide=it.side;
    if(o.ok)a.hl=Math.min(64,a.hl*2);else{a.hl=Math.max(.5,a.hl/2);a.wrong++;a.lastWrong=it.side;}
    a.due=Date.now()+a.hl*DAY;
    recordFirst(q,{c:o.ok?1:0,na:o.na?1:0,naok:(o.na&&o.ok)?1:0,conf:R.conf,h:0,k:'review',side:it.side,ms:0,noscore:0});
    track('review_answer',{quiz_id:q.x_id,pair_id:it.pid,side:it.side,correct:o.ok?1:0});
    save();drawReview();});
  document.getElementById('rv-next').onclick=()=>{R.qi++;R.tried=new Set();R.done=false;R.conf=null;R.fb=null;R.cl=null;drawReview();};
}

/* ============ 成绩单 ============ */
function scorecard(){
  const dur=Math.round(((S.finished||Date.now())-S.started)/6e4);
  const pl={v:2,site:SITE.id,cv:SITE.x_version||'',lit:lit.size,total:SITE.nodes.length,acc:acc(),
    brier:brier(),brave:braveRate(),hints:S.hints,reviews:S.reviews,best:S.calib.best,
    over:S.calib.over,gap:S.gap.n?Math.round(100*S.gap.hits/S.gap.n):null,min:dur,done:S.finished?1:0};
  return `投资教练 · ${SITE.tag}成绩单
进度 ${lit.size}/${SITE.nodes.length}${S.finished?'（已完成）':''} ｜ 首答正确率 ${acc()==null?'—':acc()+'%'} ｜ 校准分 ${brier()==null?'—':brier()+'/100'} ｜ 敢判率 ${braveRate()==null?'—':braveRate()+'%'}
提示 ${S.hints} 次 ｜ 复训 ${S.reviews} 轮 ｜ 校准连胜最高 ${S.calib.best} ｜ 过度自信 ${S.calib.over} 次 ｜ 用时约 ${dur} 分钟
（教学复盘，非投资建议）
IC2|${btoa(unescape(encodeURIComponent(JSON.stringify(pl))))}`;
}

/* ============ 杂项 ============ */
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800);}
render();track('session_start',{});
if(!S.coach)pickCoach(true);
if(/MicroMessenger/i.test(navigator.userAgent))
  setTimeout(()=>toast('微信里可能清掉进度：建议右上角「用浏览器打开」'),1200);
window.addEventListener('beforeunload',()=>{track('session_end',{});flush();});
</script>
