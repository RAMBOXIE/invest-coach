<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投资教练</title>
<!--

  复训队列（HLR 固定权重特例）、校准分、目录视图、成绩单、遥测（可降级）。
  判分永远是本文件内的规则引擎；LLM 不参与判分（v3 §2.6）。
-->
<style>
  :root {
    --night-1:#141b36; --night-2:#232e52;
    --paper:#fdf9f0; --ink:#37304d; --ink-soft:#6f688a;
    --gold:#ffd166; --locked:#4a5378; --good:#4fbf85; --bad:#e2606c; --na:#5aa9e6;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:radial-gradient(120% 100% at 50% 0%,var(--night-2) 0%,var(--night-1) 70%);
    color:#f2ecdd;min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:70px}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px 20px 6px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
  .journey-tag{font-size:12px;letter-spacing:3px;color:var(--gold)}
  header h1{font-size:24px;margin:4px 0 0;font-weight:700;letter-spacing:1px}
  .head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);
    border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap;border:none;color:#f2ecdd}
  .pill:hover{background:rgba(255,255,255,.13)}
  .pill .badge{background:var(--bad);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
  .progress-track{width:70px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
  .progress-fill{height:100%;border-radius:4px;background:var(--gold);width:0;transition:width .6s ease}
  .legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:12px;color:#bdb5d6;padding:8px 16px 0}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .edge-demo{width:24px;height:0;border-top:2px solid #8b93b8;display:inline-block}
  .edge-demo.soft{border-top-style:dashed}
  .edge-demo.cross{border-color:var(--gold);border-top-style:dashed}
  .map-wrap{max-width:1100px;margin:8px auto 10px;padding:0 14px}
  .map{position:relative;width:100%;aspect-ratio:3/2;border-radius:22px;
    background:radial-gradient(circle at 20% 30%,rgba(157,140,255,.08),transparent 40%),
      radial-gradient(circle at 75% 65%,rgba(69,196,176,.08),transparent 45%),rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);overflow:hidden}
  .map svg.edges,.stars{position:absolute;inset:0;width:100%;height:100%}
  .stars{pointer-events:none}
  .node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
    align-items:center;gap:5px;background:none;border:none;padding:5px;color:inherit;width:104px}
  .node .bubble{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;
    background:rgba(255,255,255,.08);border:2px solid var(--c,#888);transition:transform .15s}
  .node:hover .bubble{transform:scale(1.1)}
  .node.lit .bubble{background:var(--c);box-shadow:0 0 18px var(--c);animation:breathe 2.2s ease-in-out infinite}
  .node.locked{opacity:.42;filter:grayscale(.6)}
  .node .label{font-size:13px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .node .sub{font-size:10px;color:#bdb5d6}
  @keyframes breathe{0%,100%{box-shadow:0 0 10px var(--c)}50%{box-shadow:0 0 24px var(--c)}}
  /* 目录视图 */
  .list-wrap{max-width:760px;margin:8px auto;padding:0 14px;display:none}
  .list-wrap.show{display:block}
  .lv-group{margin-bottom:14px}
  .lv-group h3{font-size:14px;color:var(--gold);margin:10px 4px 6px;letter-spacing:2px}
  .lv-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:10px 14px;margin-bottom:6px;color:inherit}
  .lv-item:hover{background:rgba(255,255,255,.1)}
  .lv-item .ic{font-size:22px}
  .lv-item .nm{font-weight:600;font-size:14px}
  .lv-item .meta{font-size:11px;color:#bdb5d6}
  .chip{margin-left:auto;font-size:11px;border-radius:999px;padding:2px 10px;white-space:nowrap}
  .chip.lit{background:rgba(79,191,133,.2);color:#8fe0b4}
  .chip.open{background:rgba(255,209,102,.18);color:var(--gold)}
  .chip.locked{background:rgba(255,255,255,.08);color:#9a93b5}
  .chip.due{background:rgba(226,96,108,.25);color:#ffb3ba}
  /* 弹层与卡片 */
  .overlay{position:fixed;inset:0;background:rgba(10,12,28,.72);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
  .overlay.show{display:flex}
  .card{background:var(--paper);color:var(--ink);width:min(680px,100%);max-height:92vh;overflow:auto;
    border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    border-bottom:3px solid var(--c,#ccc);padding-bottom:10px}
  .kicker{font-size:11px;letter-spacing:2px;color:#fff;background:var(--c,#888);border-radius:6px;padding:2px 8px}
  .card h2{margin:6px 0 0;font-size:21px}
  .close-x{background:none;border:none;font-size:20px;color:var(--ink-soft)}
  .screen h3{margin:2px 0 8px;font-size:17px}
  .screen p{line-height:1.75;font-size:15px;margin:8px 0}
  .screen table{margin:8px 0}
  .screen details{background:#f3ead6;border-radius:12px;padding:10px 14px;margin:10px 0}
  .screen details summary{cursor:pointer;font-weight:600;font-size:14px}
  .canon{background:#efe7f7;border-left:4px solid #8646b8;border-radius:10px;padding:10px 14px;font-size:13.5px}
  .canon .c-term{font-weight:700}
  .canon .c-src{color:var(--ink-soft);font-size:12.5px;margin-top:4px}
  .toggle-canon{background:none;border:1px dashed #b9a8d8;color:#7a5ea8;border-radius:999px;
    padding:6px 12px;font-size:13px;align-self:flex-start}
  .quiz-q{font-weight:600;font-size:15.5px;line-height:1.7}
  .conf-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  .conf-row .cbtn{flex:1;min-width:90px;border:2px solid #d8cfc0;background:#fff;border-radius:12px;
    padding:9px 6px;font-size:13.5px;color:var(--ink)}
  .conf-row .cbtn.on{border-color:#8646b8;background:#efe7f7;font-weight:700}
  .conf-tip{font-size:12px;color:var(--ink-soft);margin:2px 0}
  .options{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .opt{text-align:left;font-size:14.5px;line-height:1.55;background:#fff;border:2px solid #e2d8c4;
    border-radius:12px;padding:11px 14px;color:var(--ink)}
  .opt:disabled{opacity:.86}
  .opt.right{border-color:var(--good);background:#e8f8ef}
  .opt.wrong{border-color:var(--bad);background:#fbe9ea}
  .opt.naflag{border-color:var(--na);background:#e9f3fc}
  .quiz-fb{font-size:14px;line-height:1.7;background:#fff7e0;border-radius:10px;padding:10px 12px;min-height:1em}
  .quiz-fb.good{background:#e8f8ef}
  .coach-line{display:flex;gap:8px;align-items:flex-start;background:#eef0ff;border-radius:10px;
    padding:9px 12px;font-size:13.5px;line-height:1.6}
  .coach-line .who{font-weight:700;white-space:nowrap}
  .hint-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hint-btn{background:none;border:1px solid #cbbf9f;border-radius:999px;padding:6px 12px;font-size:13px;color:#8a7a4d}
  .hint-box{background:#f6f1e2;border-radius:10px;padding:8px 12px;font-size:13.5px;line-height:1.6;width:100%}
  .card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:2px dashed #ddd2ba;padding-top:12px;flex-wrap:wrap}
  .nav-btn{border:none;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600}
  .nav-btn.next,.nav-btn.light-up{background:var(--c,#5b8);color:#fff}
  .nav-btn.back{background:#eee4cd;color:var(--ink)}
  .nav-btn:disabled{opacity:.45;cursor:not-allowed}
  .dots{display:flex;gap:5px}
  .dots i{width:7px;height:7px;border-radius:50%;background:#d8ccb2;display:inline-block}
  .dots i.on{background:var(--c,#888)}
  .celebrate{text-align:center;padding:16px 4px}
  .celebrate .big{font-size:44px}
  .testout{background:none;border:1px solid #cbbf9f;border-radius:999px;padding:5px 12px;font-size:12.5px;color:#8a7a4d;align-self:flex-start}
  /* 教练 */
  .coach-pick{display:flex;flex-direction:column;gap:10px}
  .coach-card{text-align:left;background:#fff;border:2px solid #e2d8c4;border-radius:14px;padding:12px 14px;color:var(--ink)}
  .coach-card:hover{border-color:#8646b8}
  .coach-card .cn{font-size:16px;font-weight:700}
  .coach-card .cs{font-size:12.5px;color:#8646b8;margin:2px 0}
  .coach-card .ci{font-size:13px;color:var(--ink-soft);line-height:1.6}
  .id-fold{font-size:12px;color:var(--ink-soft);margin-top:6px}
  /* 抽屉 */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);background:var(--paper);color:var(--ink);
    transform:translateX(105%);transition:transform .25s ease;z-index:60;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.35)}
  .drawer.show{transform:none}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:2px solid #e5dbc4}
  .drawer-body{overflow:auto;padding:12px 16px;font-size:13.5px;line-height:1.65}
  .drawer-note{background:#f3ead6;border-radius:10px;padding:9px 12px;margin-bottom:9px;font-size:12.5px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .stat{background:#fff;border:1px solid #e2d8c4;border-radius:12px;padding:8px 10px;text-align:center}
  .stat .v{font-size:20px;font-weight:700}
  .stat .k{font-size:11px;color:var(--ink-soft)}
  .p-item{border-bottom:1px dashed #ddd2ba;padding:9px 0}
  .p-item .row1{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .p-item .meta{font-size:12px;color:var(--ink-soft)}
  .p-item ul{margin:6px 0 0;padding-left:18px}
  .p-item li.done{color:#3c9d6d}
  .arch-item{background:#fbf3f3;border-left:3px solid var(--bad);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .small-btn{background:#fff;border:1px solid #cbbf9f;border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#221c3a;color:#ffe9b0;padding:10px 20px;border-radius:999px;font-size:14px;transition:all .25s;z-index:99;pointer-events:none;max-width:88vw}
  .toast.show{opacity:1;transform:translateX(-50%)}
  footer{position:fixed;left:0;right:0;bottom:0;background:rgba(14,17,36,.92);border-top:1px solid rgba(255,255,255,.1);
    font-size:11px;color:#9a93b5;text-align:center;padding:7px 12px;line-height:1.5;z-index:40}
  @media (max-width:640px){
    header h1{font-size:19px}
    .map{aspect-ratio:2/3}
    .node{width:88px}
    .node .bubble{width:46px;height:46px;font-size:20px}
    .node .label{font-size:11.5px}
    .node .sub{display:none}
  }
</style>

<body>
<header>
  <div>
    <div class="journey-tag" id="journey-tag"></div>
    <h1 id="journey-title"></h1>
  </div>
  <div class="head-right">
    <button class="pill" id="coach-pill" title="你的教练">🎓 教练</button>
    <button class="pill" id="review-pill" hidden>🔁 复训 <span class="badge" id="review-n">0</span></button>
    <span class="pill"><span id="prog-num">0</span>/<span id="prog-total">0</span>
      <span class="progress-track"><span class="progress-fill" id="prog-fill"></span></span></span>
    <button class="pill" id="view-toggle">📋 目录</button>
    <button class="pill" id="records-open">📇 档案</button>
  </div>
</header>
<div class="legend" id="legend"></div>
<div class="map-wrap"><div class="map" id="map">
  <svg class="stars" viewBox="0 0 1200 800" preserveAspectRatio="none"></svg>
  <svg class="edges" viewBox="0 0 1200 800" preserveAspectRatio="none"></svg>
</div></div>
<div class="list-wrap" id="list-wrap"></div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<div class="overlay" id="coach-overlay"><div class="card" id="coach-card"></div></div>

<div class="drawer" id="drawer">
  <div class="drawer-head"><b>📇 学习档案</b><button class="close-x" id="records-close">✕</button></div>
  <div class="drawer-body" id="drawer-body"></div>
</div>
<div class="toast" id="toast"></div>
<footer>仅供学习 · 全部内容为历史案例复盘 · 不构成投资建议，无前瞻信号与收益承诺<br>
术语与定义来自所列正典出处；通俗解释与教练点评由 AI 起草、经人工核对；判分由页面内置规则完成，AI 不参与判分</footer>

<script>
'use strict';
const SITE = /*__DATA__*/null;
const BACKEND = /*__BACKEND__*/null;
if (!SITE) { document.body.innerHTML = '<p style="padding:40px">数据未注入：请用 tools/build.py 构建。</p>'; throw new Error('no data'); }

/* ---------- 常量与索引 ---------- */
const byId = Object.fromEntries(SITE.nodes.map(n => [n.id, n]));
const COACHES = SITE.x_coaches || [];
const coachById = Object.fromEntries(COACHES.map(c => [c.id, c]));
const NOSCORE = new Set(['case-first-look']);           // 第一案不计分（裁决 2026-08-22）
const CONF = [{v:.55,t:'没把握'},{v:.75,t:'比较有把握'},{v:.95,t:'很有把握'}];
const BANK = {};                                        // pairId -> {a:[quiz],b:[quiz]}
(SITE.x_review_bank||[]).forEach(it => {
  (BANK[it.pair_id] = BANK[it.pair_id] || {a:[],b:[]})[it.side].push(it.quiz);
});
const PAIRS = {};                                       // pairId -> {node, look, key}
SITE.nodes.forEach(n => (n.x_pairs||[]).forEach(p => { if (p.id) PAIRS[p.id] = {node:n, look:p.look, a:p.a, b:p.b, key:p.key}; }));
const domains = [...new Set(SITE.nodes.map(n => n.domain || '通用'))];
const PALETTE = ['#5ba9e6','#e6a05b','#b18ae6','#5bc98b','#e65b8a','#8ae6d5'];
const domainColor = Object.fromEntries(domains.map((d,i) => [d, PALETTE[i % PALETTE.length]]));

/* canon 按钮文案按出处定制（裁决 2026-08-22 #14） */
function canonLabel(src){
  src = src || '';
  if (src.includes('Graham')) return '📖 格雷厄姆怎么说';
  if (src.includes('SEC')) return '📖 SEC 怎么认定';
  if (src.includes('ASC') || src.includes('IAS') || src.includes('IFRS')) return '📖 会计准则怎么说';
  if (src.includes('Schilit')) return '📖 《财务诡计》怎么说';
  if (src.includes('审计清单')) return '📖 审计研究怎么说';
  if (/Beneish|Sloan|Kahneman|Baron|Heuer|Dyck|Sedlmeier/.test(src)) return '📖 文献怎么说';
  return '📖 教科书怎么说';
}

/* ---------- 状态（localStorage） ---------- */
const KEY = 'invest-coach:ch1';
function newState(){
  return { v:1, lit:[], coach:null, device: 'd-' + Math.random().toString(36).slice(2) + Date.now().toString(36),
    answers:{}, archive:{}, calib:{n:0,sum:0,streak:0,best:0}, brave:{n:0,dared:0},
    hints:0, reviews:0, events:[], started:Date.now(), finished:0 };
}
let S = newState();
try { const raw = JSON.parse(localStorage.getItem(KEY) || 'null'); if (raw && raw.v === 1) S = Object.assign(newState(), raw); } catch(e){}
let lit = new Set(S.lit.filter(i => byId[i]));
let lsOK = true;
function save(){ S.lit = [...lit]; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ if (lsOK){ lsOK=false; toast('浏览器不允许保存进度（隐私模式？）——本次可玩，进度不会保留'); } } }

/* ---------- 遥测（后端未配置时静默降级） ---------- */
function track(t, data){
  S.events.push(Object.assign({t, ts: Date.now()}, data || {}));
  if (S.events.length > 400) S.events = S.events.slice(-400);
  save();
}
function flush(){
  if (!BACKEND || !S.events.length) return;
  const payload = JSON.stringify({device:S.device, content_version:SITE.x_version||'', schema_version:1, events:S.events});
  try { fetch(BACKEND + '/api/v1/events', {method:'POST', headers:{'Content-Type':'text/plain'}, body:payload, keepalive:true})
    .then(r => { if (r.ok){ S.events = []; save(); } }).catch(()=>{}); } catch(e){}
}
setInterval(flush, 30000);

/* ---------- 教练 ---------- */
function coach(){ return coachById[S.coach] || COACHES[0]; }
const lineIdx = {};
function coachLine(when){
  const c = coach(); if (!c) return null;
  const ls = (c.style_lines||[]).filter(l => l.when === when);
  if (!ls.length) return null;
  lineIdx[when] = ((lineIdx[when]||0) + 1) % ls.length;
  return {who: c.name, t: ls[lineIdx[when]].t};
}
function coachPicker(force){
  const ov = document.getElementById('coach-overlay'), cd = document.getElementById('coach-card');
  cd.innerHTML = `<div class="card-head" style="--c:#8646b8"><div><span class="kicker">选择你的教练</span>
    <h2>🎓 谁来陪你练？</h2></div>${force?'':'<button class="close-x" id="cp-x">✕</button>'}</div>
    <p style="font-size:13.5px;color:var(--ink-soft)">教练是<b>学派原型</b>，不是真人；点评由 AI 起草、经人工核对。判分与教练无关——教练只换视角，不换对错。随时可换。</p>
    <div class="coach-pick">${COACHES.map(c => `
      <button class="coach-card" data-c="${c.id}">
        <div class="cn">${c.name}${S.coach===c.id?' ✓':''}</div>
        <div class="cs">${c.school}</div>
        <div class="ci">${c.intro}</div>
        <div class="id-fold">${c.x_identity||''}</div>
      </button>`).join('')}</div>`;
  ov.classList.add('show');
  if (!force) document.getElementById('cp-x').onclick = () => ov.classList.remove('show');
  cd.querySelectorAll('.coach-card').forEach(b => b.onclick = () => {
    S.coach = b.dataset.c; save(); track('coach_pick',{coach:S.coach});
    ov.classList.remove('show'); toast(coach().name + ' 上任了 🎓'); renderHeader();
  });
}
document.getElementById('coach-pill').onclick = () => coachPicker(false);

/* ---------- 布局（改造自 learn-map，MIT） ---------- */
const preds = {};
SITE.edges.forEach(e => { (preds[e.to] = preds[e.to] || []).push(e.from); });
const layerMemo = {};
function layerOf(id, seen){
  if (id in layerMemo) return layerMemo[id];
  seen = seen || new Set();
  if (seen.has(id)) return 0;
  seen.add(id);
  const ps = preds[id] || [];
  const v = ps.length ? 1 + Math.max(...ps.map(p => layerOf(p, seen))) : 0;
  layerMemo[id] = v; return v;
}
SITE.nodes.forEach(n => layerOf(n.id));
const maxLayer = Math.max(...Object.values(layerMemo));
const cols = {};
SITE.nodes.forEach(n => { (cols[layerMemo[n.id]] = cols[layerMemo[n.id]] || []).push(n); });
Object.entries(cols).forEach(([L, arr]) => {
  const x = maxLayer ? 110 + (980 * L / maxLayer) : 600;
  arr.forEach((n,i) => {
    n.x = x + ((i%2)?26:-26) * (arr.length>1?1:0);
    n.y = arr.length===1 ? 400 : 110 + (580 * i / (arr.length-1));
  });
});

function stateOf(node){
  if (lit.has(node.id)) return 'lit';
  const hard = SITE.edges.filter(e => e.to === node.id && e.type === 'hard').map(e => e.from);
  return hard.every(p => lit.has(p)) ? 'open' : 'locked';
}

/* ---------- 复训队列（HLR 固定权重特例：初始半衰期 1 天，对×2 错÷2） ---------- */
const DAY = 86400000;
function ensurePair(pid){
  if (!S.archive[pid]) S.archive[pid] = {w:0, seen:0, lastSide:null, lastWrong:null, hl:1, due:Date.now()+DAY};
  return S.archive[pid];
}
function duePairs(){ const now = Date.now(); return Object.keys(S.archive).filter(p => PAIRS[p] && BANK[p] && S.archive[p].due <= now); }
function reviewResult(pid, side, correct){
  const a = ensurePair(pid);
  a.seen++; a.lastSide = side;
  if (correct) a.hl = Math.min(64, a.hl*2); else { a.hl = Math.max(.5, a.hl/2); a.w++; }
  a.due = Date.now() + a.hl*DAY;
}

/* ---------- 校准 ---------- */
function firstAnswer(q, rec){
  if (S.answers[q.x_id]) return;                        // 首答只记一次
  S.answers[q.x_id] = rec;
  const noscore = NOSCORE.has(cur.id) && cur.mode==='node';
  if (q.confidence && !noscore){
    const naOpt = (q.opts||[]).find(o=>o.na);
    const judgeable = naOpt && !naOpt.ok;
    if (judgeable){ S.brave.n++; if (!rec.na) S.brave.dared++; }
    if (!(rec.na && !rec.naok)){                        // 诚实弃权(na_dodge)不进 Brier
      S.calib.n++; S.calib.sum += Math.pow(rec.conf - (rec.c?1:0), 2);
    }
    if (rec.conf === .95 && !rec.c && !rec.na){ S.calib.streak = 0; }
    else if (rec.c){ S.calib.streak++; S.calib.best = Math.max(S.calib.best, S.calib.streak); }
  }
  if (q.x_pair && PAIRS[q.x_pair]){
    const a = ensurePair(q.x_pair);
    if (!rec.c && !rec.na && !rec.noscore){ a.w++; a.lastWrong = rec.k==='review' ? rec.side : 'node'; }  // 第一案不计分：不进站错边
  }
  track('first_answer', {quiz_id:q.x_id, pair_id:q.x_pair||null, side:rec.side||null, kind:rec.k,
    correct:rec.c?1:0, na:rec.na?1:0, conf:rec.conf||null, hints:rec.h, latency:rec.ms});
  save();
}
function brierIndex(){ return S.calib.n ? Math.round((1 - Math.sqrt(S.calib.sum/S.calib.n)) * 100) : null; }
function firstAccuracy(){
  const arr = Object.values(S.answers).filter(r => !r.noscore);
  if (!arr.length) return null;
  return Math.round(100 * arr.filter(r => r.c).length / arr.length);
}

/* ---------- 卡片与题引擎 ---------- */
const overlay = document.getElementById('overlay');
const cardEl = document.getElementById('card');
let cur = {};
overlay.addEventListener('click', e => { if (e.target === overlay && cur.mode !== 'review') closeCard(); });
function closeCard(){ overlay.classList.remove('show'); flush(); }

function openCard(id){
  const node = byId[id];
  cur = { mode:'node', id, node, idx:0, ui:{}, canonOpen:false };
  track('node_open', {node:id});
  overlay.classList.add('show');
  drawCard();
}
function qState(q){                                    // 本次会话的题面状态
  if (!cur.ui[q.x_id]) cur.ui[q.x_id] = {tried:new Set(), done:false, conf:null, hint:0, t0:Date.now(), fb:null, cl:null};
  return cur.ui[q.x_id];
}
function quizSatisfied(q){
  const u = cur.ui[q.x_id];
  if (u && u.done) return true;
  if (q.x_kind === 'pretest') return !!(u && u.tried.size);
  return false;
}
function pickCoachContext(q, o, u){
  if (o.na && o.ok) return 'na_honest';
  if (o.na && !o.ok) return 'na_dodge';
  if (!o.ok && u.conf === .95) return 'overconfident';
  if (!o.ok) return 'wrong';
  if (o.ok && u.hint > 0) return 'hint_used';
  return 'correct';
}
function renderQuiz(q){
  const u = qState(q);
  const needConf = !!q.confidence;
  const confPicked = u.conf != null;
  let h = `<div class="screen"><p class="quiz-q">${q.q}</p>`;
  if (needConf){
    h += `<p class="conf-tip">先标注你的把握（进校准分，诚实最划算）：</p>
      <div class="conf-row">${CONF.map(c =>
        `<button class="cbtn${u.conf===c.v?' on':''}" data-conf="${c.v}" ${u.done?'disabled':''}>${c.t}</button>`).join('')}</div>`;
  }
  const lock = u.done || (needConf && !confPicked);
  h += `<div class="options">${q.opts.map((o,i) => {
    let cls = '';
    if (u.done && o.ok) cls = ' right';
    else if (u.tried.has(i) && !o.ok) cls = o.na ? ' naflag' : ' wrong';
    return `<button class="opt${cls}" data-i="${i}" ${lock||u.tried.has(i)?'disabled':''}>${o.t}</button>`;
  }).join('')}</div>`;
  if (u.fb) h += `<div class="quiz-fb${u.fbGood?' good':''}">${u.fb}</div>`;
  if (u.cl) h += `<div class="coach-line"><span class="who">${u.cl.who}：</span><span>${u.cl.t}</span></div>`;
  if (!u.done && (q.hints||[]).length){
    h += `<div class="hint-row"><button class="hint-btn" data-hint="1">💡 提示（${u.hint}/${q.hints.length}）</button></div>`;
    if (u.hint > 0) h += `<div class="hint-box">${q.hints.slice(0,u.hint).map((x,i)=>`${'①②③'[i]} ${x}`).join('<br>')}</div>`;
  }
  h += '</div>';
  return h;
}
function bindQuiz(q, ctx){
  const u = qState(q);
  cardEl.querySelectorAll('[data-conf]').forEach(b => b.onclick = () => { u.conf = +b.dataset.conf; drawCur(); });
  const hb = cardEl.querySelector('[data-hint]');
  if (hb) hb.onclick = () => { if (u.hint < (q.hints||[]).length){ u.hint++; S.hints++; save(); } drawCur(); };
  cardEl.querySelectorAll('.opt:not([disabled])').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, o = q.opts[i];
    const first = !u.tried.size && !S.answers[q.x_id];
    u.tried.add(i);
    const kind = q.x_kind || 'main';
    if (o.ok){ u.done = true; u.fb = q.fb; u.fbGood = true; }
    else if (kind === 'pretest'){ u.done = false; u.fb = q.fb; u.fbGood = false; }
    else { u.fb = o.na ? '这题的证据其实够了——回头再看看材料，够在哪？' : '不对——要不要点一级提示？'; u.fbGood = false; }
    const cx = kind === 'pretest' ? (o.ok ? 'correct' : 'wrong') : pickCoachContext(q, o, u);
    let line = coachLine(cx);
    if (!o.ok && !o.na && q.x_pair && (S.archive[q.x_pair]||{}).w >= 2){
      const pr = coachLine('pair_repeat');
      if (pr && PAIRS[q.x_pair]) line = {who:pr.who, t:pr.t + '（' + PAIRS[q.x_pair].look + '）'};
    }
    u.cl = line;
    if (first){
      firstAnswer(q, {c:o.ok?1:0, na:o.na?1:0, naok:(o.na&&o.ok)?1:0, conf:u.conf, h:u.hint,
        k:ctx.k, side:ctx.side||null, ms:Date.now()-u.t0, noscore: NOSCORE.has(cur.id)&&cur.mode==='node' ? 1:0});
    }
    if (ctx.k === 'review' && (o.ok || !o.na)) {       // 复训：诚实弃权不更新调度
      if (!u.rvDone){ u.rvDone = true; reviewResult(q.x_pair, ctx.side, o.ok); track('review_answer',{quiz_id:q.x_id,pair_id:q.x_pair,side:ctx.side,correct:o.ok?1:0}); save(); }
    }
    drawCur();
  });
}

function drawCard(){
  const node = cur.node;
  const screens = node.screens || [];
  if (!screens.length){ cardEl.innerHTML = '<p style="padding:30px">该节点内容尚未发布。</p>'; return; }
  const s = screens[cur.idx];
  const color = domainColor[node.domain||'通用'];
  const alreadyLit = lit.has(node.id);
  let inner = `<div class="card-head" style="--c:${color}">
    <div><span class="kicker">${node.domain||''}${node.age?' · '+node.age:''}</span>
      <h2>${node.icon} ${node.name}</h2></div>
    <button class="close-x" id="card-close" aria-label="关闭">✕</button></div>`;
  if (cur.idx === 0 && !alreadyLit && screens.some(x=>x.quiz)){
    inner += `<button class="testout" id="btn-testout">⚡ 我会了，直接做题</button>`;
  }
  if (node.canon){
    inner += `<button class="toggle-canon" id="btn-canon">${cur.canonOpen?'▾ 收起':canonLabel(node.canon.source)}</button>`;
    if (cur.canonOpen){
      inner += `<div class="canon"><div class="c-term">${node.canon.term}</div>
        <div>${node.canon.formal}</div>
        <div class="c-src">出处：${node.canon.source}${node.canon.x_cite?'<br>定位：'+node.canon.x_cite:''}${node.canon.textbook?'<br>体系位置：'+node.canon.textbook:''}</div></div>`;
    }
  }
  if (s.quiz) inner += renderQuiz(s.quiz);
  else inner += `<div class="screen"><h3>${s.h||''}</h3>${s.body||''}</div>`;
  if (s.quiz && node.x_coach_notes && quizSatisfied(s.quiz)){
    const notes = node.x_coach_notes, main = coach();
    if (notes[main.id]) inner += `<div class="coach-line"><span class="who">${main.name}：</span><span>${notes[main.id]}</span></div>`;
    const others = COACHES.filter(c => c.id !== main.id && notes[c.id]);
    if (others.length) inner += `<details style="background:#eef0ff;border-radius:10px;padding:8px 12px"><summary style="font-size:13px">👂 听听其他两位怎么看</summary>${
      others.map(c => `<div class="coach-line" style="margin-top:6px"><span class="who">${c.name}：</span><span>${notes[c.id]}</span></div>`).join('')}</details>`;
  }
  const isLast = cur.idx === screens.length - 1;
  const allDone = screens.every(sc => !sc.quiz || quizSatisfied(sc.quiz));
  const blocked = s.quiz && !quizSatisfied(s.quiz);
  inner += `<div class="card-foot" style="--c:${color}">
    <button class="nav-btn back" id="btn-back" ${cur.idx===0?'disabled':''}>上一页</button>
    <div class="dots">${screens.map((_,i)=>`<i class="${i===cur.idx?'on':''}"></i>`).join('')}</div>
    ${isLast
      ? (alreadyLit ? `<button class="nav-btn back" id="btn-close2">完成复习</button>`
        : `<button class="nav-btn light-up" id="btn-light" ${allDone?'':'disabled'}>✨ 点亮它</button>`)
      : `<button class="nav-btn next" id="btn-next" ${blocked?'disabled':''}>下一页</button>`}</div>`;
  cardEl.innerHTML = inner;
  cardEl.style.setProperty('--c', color);
  document.getElementById('card-close').onclick = closeCard;
  const g = id => document.getElementById(id);
  if (g('btn-back')) g('btn-back').onclick = () => { cur.idx--; drawCard(); };
  if (g('btn-next')) g('btn-next').onclick = () => { cur.idx++; track('screen_view',{node:node.id,screen:cur.idx}); drawCard(); };
  if (g('btn-close2')) g('btn-close2').onclick = closeCard;
  if (g('btn-light')) g('btn-light').onclick = () => lightUp(node.id);
  if (g('btn-canon')) g('btn-canon').onclick = () => { cur.canonOpen = !cur.canonOpen; drawCard(); };
  if (g('btn-testout')) g('btn-testout').onclick = () => {
    const qi = screens.findIndex(x => x.quiz);
    if (qi >= 0){ cur.idx = qi; track('testout',{node:node.id}); drawCard(); }
  };
  if (s.quiz) bindQuiz(s.quiz, {k: s.quiz.x_kind || 'main'});
}
function drawCur(){ cur.mode === 'review' ? drawReview() : drawCard(); }

function lightUp(id){

/* ---------- 复训会话 ---------- */
document.getElementById('review-pill').onclick = startReview;
function pickReviewQuiz(pid){
  const a = ensurePair(pid), bank = BANK[pid];
  let side = a.lastWrong === 'a' || a.lastWrong === 'b' ? a.lastWrong : (a.lastSide === 'a' ? 'b' : 'a');
  if (!bank[side] || !bank[side].length) side = side === 'a' ? 'b' : 'a';
  const list = bank[side];
  return {q: list[a.seen % list.length], side};
}
function startReview(){
  const dues = duePairs();
  if (!dues.length) return toast('没有到期的复训 ✓');
  cur = {mode:'review', queue: dues.map(pickReviewQuizWrap), qi:0, ui:{}, results:[]};
  S.reviews++; save(); track('review_start',{n:dues.length});
  overlay.classList.add('show');
  drawReview();
  function pickReviewQuizWrap(pid){ const r = pickReviewQuiz(pid); return {pid, side:r.side, q:r.q}; }
}
function drawReview(){
  const item = cur.queue[cur.qi];
  if (!item){                                          // 收尾
    const ok = cur.results.filter(x=>x).length;
    cardEl.innerHTML = `<div class="celebrate"><div class="big">🔁</div><h4>复训完成：${ok}/${cur.results.length}</h4>
      <p style="font-size:13.5px;color:var(--ink-soft)">答对的对，下次来得更晚；答错的对，很快再见。</p></div>
      <div class="card-foot" style="justify-content:center"><button class="nav-btn light-up" id="rv-done" style="--c:#8646b8">回到地图</button></div>`;
    document.getElementById('rv-done').onclick = () => { closeCard(); render(); };
    return;
  }
  const q = item.q, u = qState(q);
  const pmeta = PAIRS[item.pid];
  let inner = `<div class="card-head" style="--c:#8646b8">
    <div><span class="kicker">复训 ${cur.qi+1}/${cur.queue.length} · ${pmeta?pmeta.node.name:''}</span>
      <h2>🔁 混淆对：${pmeta?pmeta.look:item.pid}</h2></div>
    <button class="close-x" id="rv-x">✕</button></div>`;
  inner += renderQuiz(q);
  const done = quizSatisfied(q) || (u.tried.size && u.rvDone);
  inner += `<div class="card-foot" style="--c:#8646b8"><span style="font-size:12px;color:var(--ink-soft)">调度=混淆对 · 对×2 错÷2</span>
    <button class="nav-btn next" id="rv-next" ${done?'':'disabled'}>${cur.qi+1===cur.queue.length?'完成':'下一题'}</button></div>`;
  cardEl.innerHTML = inner;
  cardEl.style.setProperty('--c', '#8646b8');
  document.getElementById('rv-x').onclick = () => { closeCard(); render(); };
  document.getElementById('rv-next').onclick = () => {
    cur.results.push(!!(cur.ui[q.x_id]||{}).done);
    cur.qi++; drawReview(); renderHeader();
  };
  bindQuiz(q, {k:'review', side:item.side});
}

/* ---------- 档案抽屉 ---------- */
const drawer = document.getElementById('drawer');
document.getElementById('records-open').onclick = () => { drawer.classList.add('show'); renderDrawer(); };
document.getElementById('records-close').onclick = () => drawer.classList.remove('show');
function renderDrawer(){
  const stName = {lit:'已点亮', open:'进行中', locked:'未解锁'};
  const bi = brierIndex(), acc = firstAccuracy();
  const brave = S.brave.n ? Math.round(100*S.brave.dared/S.brave.n) : null;
  let html = `<div class="drawer-note">${SITE.about||''}</div>
    <div class="stat-grid">
      <div class="stat"><div class="v">${acc==null?'—':acc+'%'}</div><div class="k">首答正确率</div></div>
      <div class="stat"><div class="v">${bi==null?'—':bi}</div><div class="k">校准分（0-100）</div></div>
      <div class="stat"><div class="v">${brave==null?'—':brave+'%'}</div><div class="k">敢判率（并读，防怂）</div></div>
      <div class="stat"><div class="v">${S.calib.streak}</div><div class="k">当前校准连胜</div></div>
    </div>`;
  const arch = Object.entries(S.archive).filter(([p,a]) => PAIRS[p] && a.w > 0).sort((a,b)=>b[1].w-a[1].w);
  if (arch.length){
    const c = coach();
    html += `<div class="drawer-note">🗂️ <b>错题档案（${c?c.name:'教练'}的记忆）</b>${arch.map(([p,a]) =>
      `<div class="arch-item">「${PAIRS[p].look}」——你在这个对上站错 <b>${a.w}</b> 次。<br>
      <span style="color:var(--ink-soft)">区分线索：${PAIRS[p].key}</span><br>
      <span style="color:var(--ink-soft)">下次复训：${a.due<=Date.now()?'已到期':new Date(a.due).toLocaleDateString()}（半衰期 ${a.hl} 天）</span></div>`).join('')}</div>`;
  }
  html += `<div class="row-btns">
      <button class="small-btn" id="btn-card">📋 复制成绩单</button>
      <button class="small-btn" id="btn-reset">重置进度</button></div>
    ${SITE.reorder?`<div class="drawer-note">🔀 <b>为什么是这个顺序</b>：${SITE.reorder}</div>`:''}
    ${SITE.sources&&SITE.sources.length?`<div class="drawer-note">📚 <b>本章出处档案（每条可溯源）</b><br>${SITE.sources.map(s=>`· ${s.url?`<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`:s.name}（${s.type}）`).join('<br>')}</div>`:''}`;
  for (const node of SITE.nodes){
    const st = stateOf(node);
    html += `<div class="p-item"><div class="row1">${node.icon} ${node.name}
      <span class="chip ${st}">${stName[st]}</span></div>
      <div class="meta">${node.domain||''}${node.age?' · '+node.age:''}${node.canon?` · 📖 ${node.canon.source}`:''}</div>
      <ul>${(node.evidence||[]).map(ev=>`<li class="${st==='lit'?'done':''}">${ev}</li>`).join('')}</ul></div>`;
  }
  document.getElementById('drawer-body').innerHTML = html;
  document.getElementById('btn-card').onclick = () => navigator.clipboard.writeText(scorecardText()).then(()=>toast('成绩单已复制 📋'));
  document.getElementById('btn-reset').onclick = () => {
    if (!confirm('清空全部进度（含档案与校准分）？')) return;
    S = newState(); lit = new Set(); save(); render(); renderDrawer(); toast('已重置');
  };
}

/* ---------- 杂项 ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
}

render();
track('session_start',{});
if (!S.coach) coachPicker(true);
window.addEventListener('beforeunload', () => { track('session_end',{}); flush(); });
</script>
</body>
</html>
