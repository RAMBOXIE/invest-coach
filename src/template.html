<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EAD6"><!-- paper-100，随 tokens 手动同步 -->
<title>投资教练</title>
<!--
  invest-coach 前端 v2「判卷台」（单文件，手机优先）。
  图谱布局/解锁思路源自 agent-graph-learning 的 learn-map template
  （MIT License, Copyright (c) 2026 Lichangfocus，见仓库 NOTICE.md）。
  形态规格见 docs/_superseded/形态规格_v2_判卷台.md。
  判分永远是本文件内的规则引擎；LLM 不判分、不读用户自由文本（v3 §2.6 + 裁决 5）。
-->
<style>
/*__TOKENS__*/
  :root{
    /* 简写一律是令牌别名，不再持有字面值。改配色只动 design/tokens.json。
       门禁 tools/check_tokens.py 会挡住任何新增的字面色值/字号。 */
    --bg1:var(--surface-shell);      /* v2 纸面翻正：曾是 #141b36（夜） */
    --bg2:var(--surface-shell-alt);  /* 曾是 #232e52 */
    --card:var(--surface-card);
    --ink:var(--text-body-color);
    --soft:var(--text-meta-color);   /* 曾是 #6f688a，对比 3.24:1，不达 AA */
    --gold:var(--state-focus);       /* 纸面用 amber-700；幕内用 --state-focus-on-stage */
    --on-gold:var(--surface-card);   /* 压在 gold 填充上的字：纸面 gold 是深琥珀 → 浅字 */
    --press:var(--state-press);      /* 按下态叠加：纸上压深 */
    --good:var(--state-clear);
    --bad:var(--state-flag);
    --na:var(--state-unknown);
    --violet:var(--brand-violet);
    --line:var(--surface-rule);
    --tap:var(--tap-rec);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-ui);
    background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1) 70%);
    color:var(--text-body-color);min-height:100svh;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}

  /* ===== 点击反馈：全站统一的按下 / 焦点 / 禁用三态 =====
     铁律「每个点击都要有反馈」。* 里关掉了 -webkit-tap-highlight-color，
     不自己补的话手机上点任何东西都是**零反应**——v2.1 之前全站一条 :active 都没有。

     按下态用 inset 阴影而不是改 background：它盖在任何底上都成立
     （外壳渐变、金色填充、纸卡、暗岛、原档引文块），且不参与布局、不会挤动文字。
     --press 是两份值的语义（§3 双场），纸上压深、幕上提亮，容器切别名时自动跟着走。

     按元素而不是按类：这个站的控件几乎全是 <button>，按类列清单迟早会漏。 */
  button,summary,a[href],[role=button]{cursor:pointer;
    -webkit-touch-callout:none;touch-action:manipulation}
  button:active,summary:active,a[href]:active,[role=button]:active{
    box-shadow:inset 0 0 0 999px var(--press);transform:translateY(1px)}
  button:disabled,button[disabled],.rowbtn[disabled]{cursor:not-allowed}
  /* 禁用要看得出来。判卷台的选项在「未标把握」时就是 disabled 的，
     原来既没有灰化也没有 not-allowed，用户只知道点了没反应。
     .right/.wrong/.naf 是作答后的判分高亮，不能被灰掉。 */
  .opt:disabled:not(.right):not(.wrong):not(.naf),
  .seg button:disabled,.card-c:disabled,.chk:disabled,
  .ro .opts button:disabled,.hintbtn:disabled{opacity:.42}
  button:disabled:active,button[disabled]:active{box-shadow:none;transform:none}
  /* 焦点环：键盘用户唯一的方位感。原来只有 <button> 有，summary / a / input 全是裸的。 */
  button:focus-visible,summary:focus-visible,a[href]:focus-visible,
  input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
    outline:3px solid var(--gold);outline-offset:2px}
  /* 输入框在得到焦点时也要有明确的边界变化，不能只靠外面的 outline */
  input:focus,textarea:focus{border-color:var(--gold);outline-offset:1px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .app{max-width:560px;margin:0 auto;padding:0 14px calc(84px + env(safe-area-inset-bottom))}
  /* 顶栏 */
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 2px 8px;position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--bg1) 70%,transparent)}
  .top .tt{font-size:var(--size-13);letter-spacing:2px;color:var(--gold)}
  .top h1{font-size:var(--size-17);margin:2px 0 0;font-weight:700}
  /* 图标：描线、继承 currentColor、随字号缩放 */
  .pop-ic{font-size:var(--size-40);line-height:1;color:var(--state-focus)}
  .pop-ic .ic-s{stroke-width:1.2}
  .ic-hero{font-size:var(--size-24);line-height:1;display:inline-flex;color:var(--state-focus)}
  .ic-s{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
  .ic-lg{width:1.35em;height:1.35em;stroke-width:1.5}
  /* 通用卡 */
  .sec{background:var(--surface-card);border:1px solid var(--surface-rule);
    border-radius:16px;padding:14px;margin:10px 0}
  .sec h2{font-size:var(--size-13);margin:0 0 8px;color:var(--gold);letter-spacing:1px;font-weight:600}
  /* 今日页的「现在做这个」卡。
     它一度是整块暗色（night-800→night-900 渐变），注释写着「幕的入口暗岛」。
     但队首**不一定是幕**——是复训、处方或节点时，那块暗色就在传递一个假信号，
     而 DESIGN.md §1 的表格明确规定外壳与卡片用纸面，暗色只留给幕。
     结果是一块占手机首屏 37% 的深色区，既违反契约又与四周不协调。

     现在：默认纸面卡，别名全部继承根上的纸面一套；**只有 .hero.story
     （队首确实是一幕）才切到暗场**。这样「离开纸 = 进入叙事」才是真信号。 */

  /* ================= 今日页 IA =================
     状态条 → 唯一的下一步 → 队列预览 → 折叠。
     调度器 plan() 早就算出了优先级队列，旧版把它摊平成 8 块平级卡片让用户挑，
     等于把「今天该练什么」这个产品该做的决定推回给了用户。这套 CSS 服务的是
     「一屏一个下一步」，别再往首屏加平级 CTA。 */

  /* 进度：从页面底部提到顶部 */
  /* 网格项必须 min-width:0，否则长内容（原档引文、长标题）会撑破栏宽 */
  .today-main{min-width:0}
  .strip{padding:16px 2px 12px;border-bottom:1px solid var(--surface-rule);margin-bottom:20px}
  .strip-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .strip-p{display:flex;align-items:baseline;gap:6px}
  .strip-p .num{font-family:var(--font-mono);font-size:var(--size-24);font-weight:700;
    color:var(--text-display-color)}
  .strip-t{font-size:var(--size-13);color:var(--text-meta-color)}
  .strip-due{font-size:var(--size-13);font-weight:700;color:var(--state-focus)}
  .bar{height:3px;background:var(--surface-shell-alt);margin-top:11px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--text-display-color);
    transition:width var(--dur-trans)}
  .strip-m{margin-top:9px;font-size:var(--size-13);color:var(--text-meta-color);
    font-family:var(--font-mono)}

  /* 唯一的下一步：纸面上的暗岛，语义色整体切到「幕」的一份 */
  .hero{background:var(--surface-card);
    border:1px solid var(--line);border-radius:16px;padding:22px 18px 18px;
    margin:0 0 22px;color:var(--ink);box-shadow:0 1px 2px rgb(43 37 64 / 6%)}
  /* 队首是一幕时才进暗场。别名整套切换，.hero-* 因此不必各自写死颜色。 */
  .hero.story{background:linear-gradient(150deg,var(--surface-stage-alt),var(--surface-stage));
    border-color:var(--c-rule-on-stage);color:var(--text-narrative-color);box-shadow:none;
    --ink:var(--text-narrative-color); --soft:var(--text-meta-on-stage);
    --gold:var(--state-focus-on-stage); --bad:var(--state-flag-on-dark);
    --line:var(--c-rule-on-stage); --card:var(--surface-stage-alt);
    --on-gold:var(--surface-stage); --press:var(--state-press-on-stage)}
  .hero-eye{font-size:var(--size-13);letter-spacing:var(--track-eyebrow);
    color:var(--gold);margin-bottom:16px}
  .hero-code{font-size:var(--size-13);letter-spacing:1px;color:var(--soft)}
  .hero-why{margin:6px 0 0;font-size:var(--size-13);color:var(--soft)}
  .hero-t{font-family:var(--font-display);font-size:var(--size-display);line-height:var(--lh-tight);
    letter-spacing:var(--track-display);margin:9px 0 12px;
    font-weight:var(--weight-display);color:var(--ink)}
  .hero-s{font-size:var(--size-15);line-height:var(--lh-read);
    color:var(--soft);margin:0 0 17px}
  /* 纸面主按钮沿用基础 .cta（ink-900 底 + 浅字），和判卷台一致。
     纸面的 --gold 是深琥珀 amber-700，做实心按钮发浑，只在幕里用。 */
  .hero.story .cta{background:var(--gold);color:var(--on-gold)}
  .hero-say{margin-top:17px;padding-top:14px;border-top:1px solid var(--line);
    font-size:var(--size-13);line-height:var(--lh-read);color:var(--soft)}
  .hero-say .w{color:var(--gold);font-weight:700}

  /* 接下来：只预览，不给按钮 */
  .upnext{margin:0 0 20px}
  .upnext h2{font-size:var(--size-13);letter-spacing:1px;color:var(--text-meta-color);
    font-weight:600;margin:0 0 6px}
  .up-r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:10px 0;border-bottom:1px solid var(--surface-rule)}
  .up-t{font-size:var(--size-15);color:var(--text-body-color)}
  .up-m{font-size:var(--size-13);color:var(--text-meta-color);
    font-family:var(--font-mono);flex:none}

  /* 折叠区：参考，不是今天的任务 */
  .dw{border-bottom:1px solid var(--surface-rule)}
  .dw summary{cursor:pointer;list-style:none;padding:14px 2px;font-size:var(--size-15);
    color:var(--text-body-color);display:flex;justify-content:space-between;align-items:center;
    min-height:var(--tap-min)}
  .dw summary::-webkit-details-marker{display:none}
  .dw summary::after{content:'+';color:var(--text-meta-color);
    font-family:var(--font-mono);font-size:var(--size-17)}
  .dw[open] summary::after{content:'-'}
  .dw-in{padding:0 2px 16px}

  /* 抽屉把手：可关闭的抽屉都有一个看得见的出口（openSheet 注入） */
  .sh-grab{display:block;width:44px;height:22px;margin:-6px auto 8px;padding:0;
    position:relative;background:none;border:none}
  .sh-grab::before{content:'';position:absolute;left:50%;top:9px;transform:translateX(-50%);
    width:38px;height:4px;border-radius:2px;background:var(--line)}
  .sh-grab:active::before{background:var(--soft)}
  .sh-h{font-size:var(--size-17);font-weight:700;margin:0 0 8px;color:var(--ink)}
  .sh-h4{font-size:var(--size-15);font-weight:700;margin:14px 0 4px;color:var(--ink)}
  .sh-p{font-size:var(--size-15);line-height:var(--lh-read);color:var(--ink);margin:8px 0}
  .sh-p.lead{font-weight:600}
  .rowbtn.arch{align-items:flex-start}
  .rowbtn.arch .mt{display:block}
  .endpad{text-align:center;padding:22px 4px}
  .copyout{min-height:150px;font-family:var(--font-mono);font-size:var(--size-13)}

  /* 出处档案：18 条外链原来挤在一个 <br> 分隔的 .tip 里，实测每条 17px 高、
     间距 4px，远低于 44px 触控下限，手机上必然误点。一行一条，整行可点。 */
  .srclist{display:flex;flex-direction:column}
  .srcrow{display:flex;align-items:center;gap:10px;min-height:var(--tap-min);
    padding:10px 2px;border-bottom:1px solid var(--line);
    color:var(--state-unknown);text-decoration:none;font-size:var(--size-15)}
  .srcrow:last-child{border-bottom:none}
  .srcrow.off{color:var(--soft)}
  .srcname{flex:1;line-height:var(--lh-ui)}
  .srcgo{flex:none;opacity:.75}

  /* 内容里作者手写的 <details>（判卷台卡片里的「点一下看答案」）走的是浏览器默认样式：
     实测 21px 高，远低于 44px 触控下限。它跟 .dw 是两套 DOM，之前只给 .dw 上了样式。 */
  .body details{border:1px solid var(--line);border-radius:var(--radius-md);
    margin:var(--space-3) 0;background:var(--surface-read-alt)}
  .body details>summary{cursor:pointer;list-style:none;
    display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);
    min-height:var(--tap-rec);padding:var(--space-2) var(--space-3);
    font-size:var(--size-15);font-weight:700;color:var(--state-focus)}
  .body details>summary::-webkit-details-marker{display:none}
  .body details>summary::after{content:'+';font-family:var(--font-mono);
    font-size:var(--size-19);font-weight:400;color:var(--text-meta-color)}
  .body details[open]>summary::after{content:'-'}
  .body details>*:not(summary){padding:0 var(--space-3);margin:var(--space-2) 0}
  .dw-b{font-size:var(--size-15);line-height:var(--lh-read);color:var(--text-body-color)}

  /* 首次进入：选主教练 */
  .pick{padding:30px 2px 8px}
  .pick-eye{font-size:var(--size-13);letter-spacing:var(--track-eyebrow);color:var(--state-focus)}
  .pick-t{font-family:var(--font-display);font-size:var(--size-display);line-height:var(--lh-tight);
    letter-spacing:var(--track-display);margin:13px 0 11px;
    color:var(--text-display-color);font-weight:var(--weight-display)}
  .pick-s{font-size:var(--size-15);line-height:var(--lh-read);
    color:var(--text-meta-color);margin:0 0 26px}
  .pick-why{font-size:var(--size-13);line-height:var(--lh-read);color:var(--text-meta-color);
    background:var(--surface-card);border:1px solid var(--surface-rule);
    border-radius:var(--radius-md);padding:12px 14px;margin:0 0 22px}
  .pick-c{display:block;width:100%;text-align:left;background:var(--surface-card);
    border:1px solid var(--surface-rule);border-radius:14px;padding:17px;
    margin-bottom:10px;min-height:var(--tap-rec)}
  .pick-c:hover{border-color:var(--state-focus)}
  .pick-c[aria-current=true]{border-color:var(--state-focus);background:var(--c-amber-wash)}
  .pick-n{display:block;font-size:var(--size-19);font-weight:var(--weight-medium);
    color:var(--text-display-color);margin-bottom:5px}
  .pick-d{display:block;font-size:var(--size-13);line-height:var(--lh-ui);
    color:var(--text-meta-color)}
  .pick-c.slim{padding:13px 15px}
  .pick-c.slim .pick-n{font-size:var(--size-17)}
  .cta{display:block;width:100%;min-height:var(--tap);background:var(--text-display-color);
    color:var(--surface-card);border-radius:14px;font-size:var(--size-17);font-weight:700}
  .cta.ghost{background:transparent;color:var(--text-body-color);border:1px solid var(--surface-rule)}
  .cta:disabled{opacity:.4}
  .rowbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--surface-card);border:1px solid var(--surface-rule);
    border-radius:14px;padding:11px 13px;margin-bottom:7px;min-height:var(--tap)}
  .rowbtn .ic{font-size:var(--size-19);width:26px;text-align:center}
  .rowbtn .nm{font-weight:600;font-size:var(--size-15)}
  .rowbtn .mt{font-size:var(--size-13);color:var(--text-meta-color);margin-top:1px}
  .rowbtn[disabled]{opacity:.42}
  /* LLM 出场的标记。owner 要求：凡是 LLM 说话（或将来会由 LLM 说话）的位置，红字标出。
     .off = 这个位置将来是 LLM 的，现在没接上，显示的是本地占位。虚线框区分「是」和「将是」。 */
  .llm-tag{display:inline-block;color:var(--bad);border:1px solid var(--bad);border-radius:6px;
    padding:0 6px;font-size:var(--size-13);font-weight:700;line-height:1.6;margin-right:6px}
  .llm-tag.off{border-style:dashed;opacity:.75}
  /* 纸面上的状态芯片：淡底 + 同色系深字。v1 是暗底亮字，翻正后变成亮底亮字，
     「已读」实测 1:1——整块芯片在纸上等于不存在。 */
  .chipS{margin-left:auto;font-size:var(--size-13);border-radius:var(--radius-pill);
    padding:3px 9px;white-space:nowrap;font-weight:700}
  .chipS.lit{background:var(--c-green-wash);color:var(--state-clear)}
  .chipS.open{background:var(--c-amber-wash);color:var(--state-focus)}
  .chipS.locked{background:var(--surface-shell-alt);color:var(--text-meta-color)}
  .chipS.due{background:var(--c-red-wash);color:var(--state-flag)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .st{background:var(--surface-read-alt);border:1px solid var(--surface-rule);
    border-radius:12px;padding:9px;text-align:center}
  .st .v{font-size:var(--size-19);font-weight:700}
  .st .k{font-size:var(--size-13);color:var(--text-meta-color);margin-top:1px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    background:var(--surface-card);border-top:1px solid var(--surface-rule);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;padding:9px 0 8px;font-size:var(--size-13);color:var(--text-meta-color);min-height:var(--tap)}
  .tabbar button .i{display:block;font-size:var(--size-19);margin-bottom:1px}
  .tabbar button.on{color:var(--gold)}
  /* 全屏课节 */
  .stage{position:fixed;inset:0;z-index:40;background:var(--card);color:var(--ink);
    display:none;flex-direction:column}
  .stage.show{display:flex}
  .sbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
    border-bottom:1px solid var(--line);flex:none}
  .sbar .x{font-size:var(--size-15);color:var(--soft);min-height:44px;padding:0 6px}
  .prog{flex:1;height:6px;border-radius:3px;background:var(--surface-shell-alt);overflow:hidden}
  .prog i{display:block;height:100%;background:var(--violet);transition:width .3s}
  .sbar .n{font-size:var(--size-13);color:var(--soft)}
  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 8px}
  .foot2{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--card)}
  .step-t{font-size:var(--size-13);letter-spacing:2px;color:var(--violet);font-weight:700}
  .body h3{font-size:var(--size-19);margin:6px 0 10px;line-height:1.4}
  .body p{font-size:var(--size-narrative);line-height:1.85;margin:12px 0;max-width:34em}
  .prompt{font-size:var(--size-narrative);font-weight:600;line-height:1.75;margin:6px 0 14px;max-width:34em}
  /* 对照卡（替代表格） */
  .cmp{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0}
  .cmp .hd{display:grid;grid-template-columns:1.15fr 1fr 1fr;background:var(--surface-shell);
    font-size:var(--size-13);font-weight:700;color:var(--soft)}
  .cmp .hd>*{padding:8px 6px;text-align:center}
  .cmp .hd>*:first-child{text-align:left;padding-left:12px}
  .cmp .rw{display:grid;grid-template-columns:1.15fr 1fr 1fr;border-top:1px solid var(--line);font-size:var(--size-15)}
  .cmp .rw>*{padding:9px 6px;text-align:center}
  .cmp .rw>*:first-child{text-align:left;padding-left:12px;color:var(--soft);font-size:var(--size-13)}
  .cmp .hl{font-weight:700;color:var(--bad)}
  .cmp .ok{color:var(--state-clear)}
  .src{display:inline-flex;align-items:center;gap:4px;font-size:var(--size-13);color:var(--violet);

  /* ===== 桌面 =====

  @media(min-width:1024px){

  if(s.includes('SEC'))return b+'SEC 怎么认定';
  if(/ASC|IAS|IFRS/.test(s))return b+'会计准则怎么说';
  if(s.includes('Schilit'))return b+'《财务诡计》怎么说';
  if(s.includes('审计清单'))return b+'审计研究怎么说';
  return b+'出处怎么说';}

/* ============ 状态与调度 ============ */
function stateOf(n){if(lit.has(n.id))return'lit';
  return SITE.edges.filter(e=>e.to===n.id&&e.type==='hard').map(e=>e.from).every(p=>lit.has(p))?'open':'locked';}
function ensurePair(p){if(!S.pairs[p])S.pairs[p]={seen:0,wrong:0,hl:1,due:Date.now()+DAY,lastSide:null,lastWrong:null};return S.pairs[p];}
function duePairs(){const t=Date.now();return Object.keys(S.pairs).filter(p=>PAIRS[p]&&BANK[p]&&S.pairs[p].due<=t);}
function nextNode(){const open=SITE.nodes.filter(n=>stateOf(n)==='open');
  return open.sort((a,b)=>(a.ageStart||0)-(b.ageStart||0))[0]||null;}
function brier(){return S.calib.n?Math.round((1-Math.sqrt(S.calib.sum/S.calib.n))*100):null;}
function acc(){const a=Object.values(S.answers).filter(r=>!r.noscore);
  return a.length?Math.round(100*a.filter(r=>r.c).length/a.length):null;}
function braveRate(){return S.brave.n?Math.round(100*S.brave.dared/S.brave.n):null;}

/* 选项顺序必须打乱。

   审计发现：52 道题的正确答案**全部**排在第 1 位，而四个渲染点都按 q.opts
   原序输出。也就是说闭着眼睛永远点第一项，就能拿到 100% 首答正确率、
   满分校准、并点亮全部 14 个节点。首答正确率、Brier 校准分、
   「闭卷锚题是唯一迁移证明」这三样测量，全部被一个点击位置击穿。

   打乱必须**在一次作答内稳定**：标把握、看提示、答错重画都会重绘，
   选项这时跳位的话，用户点到的是另一个东西。所以按题 id 缓存在 R 上，
   一次作答一份；下一次作答（复训再遇到、锚题重试）重新洗。

   「无法判断」也一起洗：全站 36 道带它的题里只有 28 道排在末位，
   本来就不一致，而它有 8 次是正确答案——把它固定在末位等于留下另一条位置线索。 */
function shownOpts(q){
  R.perm=R.perm||{};
  const k=q.x_id||q.q;
  if(!R.perm[k]){
    const idx=q.opts.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
      const t=idx[i];idx[i]=idx[j];idx[j]=t;}
    R.perm[k]=idx;
  }
  return R.perm[k].map(i=>q.opts[i]);
}

/* ⓪ 处方：把「你哪儿不行」变成「所以现在做这个」。

   **这是教练和课程的分水岭。** 画像、混淆对错次、校准分这些诊断信号，
   如果只显示在仪表盘上，产品就只是一门会观察你的课程；只有当它们能改变
   队首是什么，它才是教练。守这条的是 tools/check_coach.py 的 C2 与 C6。

   纪律：**没有真处方就返回 null。** 宁可走课程顺序，也不发一张
   「反思一下你的判断习惯」的空卡——那是假动作，比没有更伤信任。 */
function prescribe(){
  const pf=profile();
  /* **这个函数必须是纯的。** plan() 每次 render 会被调用多次（队首 + 预览 + 抽屉），
     副作用写在这里的话，处方在第一次调用时就把自己烧掉了：over 被清算、
     混淆对被挪到到期，等第二次调用时触发条件已不成立，屏幕上出现的是
     普通复训卡——机制全对，用户永远看不见。落地动作在 commitPrescription()，
     由点击处理器在用户真的开始做的时候调用。 */
  /* ① 过度自信未清算：标了「很有把握」却判错了。
     这不能等 HLR 的自然到期——记忆模型算的是「你会不会忘」，
     而这里的病是「你太信自己」，两回事。立刻召回一道闭卷题重标把握。 */
  /* 过度自信有**两个**写入点：答题走 S.calib.over（recordFirst），
     案例里的判断走 profile().over（court.js）。处方原先只读后者，
     于是「答题时标了很有把握却判错」永远触发不了校准处方——
     而那恰恰是最常见的那一种。C6 当时是绿的：它只查了 .over 出现在比较里，
     没查是**哪一个** .over。 */
  if(pf.over+S.calib.over>(S.calib.settled||0)){
    const c=Object.entries(S.pairs).filter(([p])=>PAIRS[p]&&BANK[p])
      .sort((a,b)=>(b[1].wrong-a[1].wrong)||(a[1].due-b[1].due))[0];
    if(c){
      return {kind:'review',mins:1,eye:'教练标注 · 校准',pid:c[0],settle:pf.over+S.calib.over,
        t:'一道闭卷题，重新标一次把握',
        reason:`你有 ${pf.over+S.calib.over} 次标了「很有把握」却判错了`,
        s:'把握感和证据强度脱钩，是这里唯一治得了的病。这道闭卷，答完重新标把握。',
        cta:'开始',id:'go-review'};
    }
  }
  /* ② 连错两次的混淆对：HLR 的间隔是按「答对」的记忆曲线算的。
     连错两次说明这个模型对这一项已经失效，不该再按它等下去。 */
  const lp=Object.entries(S.pairs)
    .filter(([p,a])=>PAIRS[p]&&BANK[p]&&a.wrong>=2&&a.due>Date.now())
    .sort((a,b)=>b[1].wrong-a[1].wrong)[0];
  if(lp){
    return {kind:'review',mins:1,eye:'教练标注 · 你最常判错的地方',pid:lp[0],
      t:`「${PAIRS[lp[0]].look}」`,
      reason:`这个对你站错过 ${lp[1].wrong} 次，不等它自然到期了`,
      s:`区分线索：${PAIRS[lp[0]].key}`,cta:'现在就练',id:'go-review'};
  }
  /* ③ 同一个误解反复出现。
     这不是「你忘了」（那是间隔重复管的事），是「你有一个稳定的错误心智模型」。
     该给的不是同一道题——那只会让人记住答案；该给的是**另一道题里的同一个坑**。 */
  const mis=Object.entries(S.mis||{}).filter(function(e){return e[1]>=2&&(MIS[e[0]]||[]).length>1;})
    .sort(function(a,b){return b[1]-a[1];})[0];
  if(mis){
    const nid=(MIS[mis[0]].find(function(x){return x.node&&stateOf(byId[x.node])!=='locked';})||{}).node;
    if(nid&&byId[nid])return {kind:'node',mins:2,eye:'教练标注 · 同一个坑',
      t:byId[nid].name,pid:null,mis:mis[0],
      reason:'同一类判断你连着错了 '+mis[1]+' 次，换个情境再考一次',
      s:'不是同一道题。换一家公司、换一组数字，考的是同一个地方。',
      cta:'再判一次',id:'go-node',attr:' data-id="'+nid+'"'};
  }
  /* ④ 实验区里反复跳过同一个核查动作。
     这条诊断只有实验区给得出来：已结案案例问的是「判断对不对」，
     只有在真实材料上问「你接下来查什么」，才能看出他习惯性地不查哪一步。 */
  const sk=Object.entries((S.labproc||{}).skipped||{})
    .filter(function(e){return e[1]>=2;})
    .sort(function(a,b){return b[1]-a[1];})[0];
  if(sk){
    const act=LAB_ACT.find(function(a){return a.id===sk[0];});
    if(act&&act.teach&&byId[act.teach]&&stateOf(byId[act.teach])!=='locked'){
      return {kind:'node',mins:3,eye:'教练标注 · 你总是不查这一步',
        t:byId[act.teach].name,
        reason:'实验区里你有 '+sk[1]+' 次没去「'+act.t+'」',
        s:'这一步是这一节教的。回去过一遍，下次在真材料上就不会漏。',
        cta:'去补这一步',id:'go-node',attr:' data-id="'+act.teach+'"'};
    }
  }
  return null;
}

/* 自愿加练：用户练完一轮还想练时给哪一道。

   挑法和处方同源——先给他错得最多的那一组，其次给还没练过的。
   不进调度、不改到期时间：这是他自己要的，不是系统安排的，
   所以也不该因此提前消耗掉间隔重复的排期。 */
function extraDrill(){
  const inRound=new Set((R&&R.queue||[]).map(x=>x.pid));
  const cand=Object.keys(BANK).filter(p=>PAIRS[p]&&!inRound.has(p));
  if(!cand.length)return null;
  const worst=cand.map(p=>[p,(S.pairs[p]||{}).wrong||0]).sort((a,b)=>b[1]-a[1])[0];
  const pid=worst[0],a=S.pairs[pid]||{seen:0,lastSide:null};
  let side=a.lastSide==='a'?'b':'a';
  if(!BANK[pid][side]||!BANK[pid][side].length)side=side==='a'?'b':'a';
  const list=BANK[pid][side];if(!list||!list.length)return null;
  return {item:{pid,side,quiz:list[(a.seen||0)%list.length]},
    why:worst[1]>0?`你在「${PAIRS[pid].look}」上错过 ${worst[1]} 次`:`还没练过的：「${PAIRS[pid].look}」`};
}

/* 处方的落地：把「该练这个」变成「现在就到期」。**只在用户真的开始做的时候调用**——
   渲染一张卡不该清掉他的校准欠账，做完那道题才该。 */
function commitPrescription(rx){
  if(!rx||!rx.pid)return;
  const a=ensurePair(rx.pid);if(a.due>Date.now())a.due=Date.now();
  if(rx.settle)S.calib.settled=rx.settle;
  save();
}

/* ① 调度器：产出一条**有序队列**。队首是「现在做这个」，其余只做预览。
   页面不许把队列摊平成平级卡片让用户挑——「今天该练什么」是产品要替他做的决定，
   不是要他做的决定。体验 §4 那段「第1分钟复训 / 第2-4分钟新节点 / 第5分钟点亮」
   的时间感，全靠这一条。 */
function plan(){
  const dues=duePairs();
  const stories=(SITE.x_stories||[]).slice().sort((a,b)=>ORDER.indexOf(a.case_id)-ORDER.indexOf(b.case_id));
  /* 案例必须等它教的那个知识点解锁之后才排队。

     原先是 stories.find(没读过的第一个)，完全不看图。后果：ORDER 的播放顺序
     对应的节点层数是 4 → 3 → 5 → 1，新用户的第一个 8 分钟大体验（Sunbeam）
     教的是第 4 层的「应收增速跑赢收入增速」，而他还没学过增速（第 1 层）、
     应收账款（第 3 层）、权责发生制（第 2 层）。

     ORDER 本身是按**认知类型**排的（能查到 → 查不到 → 自己算错 → 根本没有数字），
     那个顺序有它的道理，所以不推翻它：保留 ORDER 作为偏好，只加一道解锁门。
     两者一起作用的结果是先修顺序正确，同时尽量维持原有的认知递进。 */
  const nextStory=stories.find(x=>{
    if((S.story||{})[x.case_id])return false;
    const kn=x.knowledge_node;
    return !kn||!byId[kn]||stateOf(byId[kn])==='lit';
  });
  const nx=nextNode();
  const lab=(SITE.x_lab||{}).cases||[];
  const q=[];
  /* 处方优先于一切固定顺序——它是唯一「因为你」而不是「因为进度」的一件事 */
  const rx=prescribe();
  if(rx)q.push(rx);
  /* 前三次会话压到 5 分钟以内（硬约束，不是目标）。产品的认知负荷本来就比
     一句翻译高得多，第一屏若显得比看 10-K 还费劲就会当场流失。
     所以头三次把队首让给最短的那一件：两拍的基础节点（约 3 分钟）。
     幕是主线，但它 8 分钟——留到用户已经走完一遍完整回路之后。 */
  const warmup = lit.size < 3 && nx && !isDeep(nx);
  // 优先级：复训有时效 > （前三次：短节点）> 幕是主线 > 节点 > 未签字的实验室
  if(dues.length)q.push({kind:'review',mins:Math.max(1,Math.round(dues.length*0.5)),
    eye:'复习到期',t:`${dues.length} 道易混题`,
    s:'闭卷。这是唯一能证明你真学会了的地方。',cta:'开始复习',id:'go-review'});
  if(warmup)q.push({kind:'node',mins:3,
    eye:`第 ${lit.size+1} 步 · 约 3 分钟`,t:nx.name,s:nx.desc,
    cta:'开始分析',id:'go-node',attr:` data-id="${nx.id}"`,
    foot:'两步：读材料 → 下结论。走完一遍你就知道这里是怎么运转的。'});
  if(nextStory)q.push({kind:'story',mins:8,
    /* 序号按**读过几个**算，不按它在 ORDER 里的下标。
       加了解锁门之后，播放顺序不再等于 ORDER 顺序——Nikola 在 ORDER 里排第 4，
       却是最先解锁的那一个，用下标会显示「第 4 例 / 共 4」而它其实是第一个。 */
    eye:`第 ${Object.keys(S.story||{}).length+1} 例 / 共 ${stories.length} · ${nextStory.era}`,
    t:nextStory.title,s:`${nextStory.subtitle}<br><span style="opacity:.82">${nextStory.hook}</span>`,
    cta:'读这个案例',id:'go-story',attr:` data-cid="${nextStory.case_id}"`,
    foot:'你会先做判断，再拿到知识点。中途可以直接问这份年报——它只用自己写过的话回答。'});
  if(nx&&!warmup)q.push({kind:'node',mins:isDeep(nx)?6:3,
    eye:`今日材料 · ${nx.domain}`,t:nx.name,s:nx.desc,
    cta:'开始分析',id:'go-node',attr:` data-id="${nx.id}"`,
    foot:isDeep(nx)?'七步：读材料 → 先写 → 挑证据 → 排除正常解释 → 下结论 → 自评 → 回顾，最后一道闭卷题才算通过。':'两步：读材料 → 下结论。'});
  /* 实验区支持多卷：原先队列与 openLab 都硬编码 cases[0]，
     管线就算产出十卷也只会出现第一卷。 */
  const labc=labNext();
  if(labc)q.push({kind:'lab',mins:3,
    eye:`近期财报 · 实验区 · 第 ${lab.indexOf(labc)+1}/${lab.length} 卷 · 未经人工复核`,
    t:labc.company,
    s:`${labc.asof} 期 · 机器从 SEC 原始申报值确定性算出的形状${labc.letter?' · 监管已就相关科目问询':''}`,
    cta:'读一卷（只读数，判过程）',id:'go-lab',
    foot:'问的不是它有没有问题，是你接下来会去查什么。不计分。'});
  const weak=Object.entries(S.pairs).filter(([p,a])=>PAIRS[p]&&a.wrong>=2&&a.due>Date.now())
    .sort((a,b)=>b[1].wrong-a[1].wrong)[0];
  return {q,dues,nx,stories,weak,read:stories.filter(x=>(S.story||{})[x.case_id])};
}

function viewToday(){
  const P=plan(), done=lit.size, total=SITE.nodes.length, pf=profile();
  // 体验 §5：首个动作是选主教练。没选过就只给这一件事，别的都不显示。
  if(!pf.tone) return coachPicker();
  const head=P.q[0], rest=P.q.slice(1);
  // 移动端是自然流；桌面用 .today 网格分栏，DOM 顺序不变（无障碍阅读顺序 = 视觉优先级）
  let side='';
  if(rest.length)side+=upNext(rest);
  side+=drawers(P,pf);
  return `<div class="today">
    ${statusStrip(done,total,P.dues.length)}
    <main class="today-main">${head?heroCard(head):allLit()}</main>
    <aside class="today-side">${side}</aside>
  </div>`;
}

/* 首次进入：只给这一件事（体验 §5 / DESIGN.md §2）。
   选的是**教练盯你哪一面**，不是选一个人物——教练自始至终是「你的教练」。 */
function coachPicker(){
  return `<div class="pick">
    <div class="pick-eye">开始之前</div>
    <h2 class="pick-t">你希望教练先盯你哪一面？</h2>
    <p class="pick-s">教练是你的，不是某个人的模拟。他会记住你的判断习惯，在你判错时告诉你错在哪。随时能换。</p>
    <p class="pick-why"><b>为什么不直接问 AI？</b>AI 能替你读完一份 10-K，但它不会训练你的判断——
      下一份年报摆在面前，做判断的还是你。这里每道题都是闭卷的：换一家公司、没见过的材料、不给提示。</p>
    ${TONES.map(x=>`<button class="pick-c" data-tone="${x.id}">
      <span class="pick-n">${x.k}</span>
      <span class="pick-d">${x.d}</span></button>`).join('')}
  </div>`;
}

/* 进度提到顶部（体验 §4「地图顶上：复训 N 题到期」）。
   没有数据的指标不渲染——首次进入摆三个「—」是纯噪音。 */
function statusStrip(done,total,nDue){
  const bits=[], a=acc(), b=brier(), br=braveRate();
  if(a!=null)bits.push(`首答 ${a}%`);
  if(b!=null)bits.push(`校准 ${b}`);
  if(br!=null)bits.push(`下结论 ${br}%`);
  return `<div class="strip">
    <div class="strip-top">

function miniMap(){
  const L={};SITE.nodes.forEach(n=>{const l=n.ageStart||1;(L[l]=L[l]||[]).push(n);});
  const maxL=Math.max(...Object.keys(L).map(Number));
  const W=320,H=190;let dots='',lines='';
  const pos={};
  Object.entries(L).forEach(([l,arr])=>arr.forEach((n,i)=>{
    pos[n.id]={x:18+(W-36)*(l-1)/(maxL-1||1),y:arr.length===1?H/2:22+(H-44)*i/(arr.length-1)};}));
  SITE.edges.forEach(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return;
    const both=lit.has(e.from)&&lit.has(e.to);
    lines+=`<line class="e${both?' on':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"${e.type!=='hard'?' stroke-dasharray="3 3"':''}/>`;});
  SITE.nodes.forEach(n=>{const p=pos[n.id],st=stateOf(n);
    dots+=`<circle class="n ${st}" cx="${p.x}" cy="${p.y}" r="${st==='lit'?5:4}"><title>${n.name}（${st==='lit'?'已通过':st==='open'?'可进入':'未解锁'}）</title></circle>`;});
  return `<svg class="mapmini" viewBox="0 0 ${W} ${H}">${lines}${dots}</svg>`;
}

function bindView(){

       而且不管有没有草稿都弹同一句 toast——用户分不清「清了」和「本来就没有」。 */
    const ks=Object.keys(localStorage).filter(k=>k.startsWith('ic:draft:'));
    if(!ks.length)return toast('没有可清除的草稿');
    if(!confirm('删除 '+ks.length+' 段你写过的文字？删了拿不回来。'))return;
    ks.forEach(k=>localStorage.removeItem(k));toast('已清除 '+ks.length+' 段草稿');};
  if(g('go-reset'))g('go-reset').onclick=()=>{if(!confirm('清空全部进度（含档案与校准分）？'))return;
    S=fresh();lit=new Set();save();render();toast('已重置');};
  document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>openNode(b.dataset.node));
  document.querySelectorAll('[data-lab]').forEach(b=>b.onclick=()=>openLab(b.dataset.lab));
  /* 错题档案的每一行原来是长得像按钮的 div：没有 handler、没有 cursor，
     看起来可点、点了什么都不发生。现在点它就把这一对提前排进复训。 */
  document.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{
    const a=ensurePair(b.dataset.pair);
    if(a.due>Date.now()){a.due=Date.now();save();toast('已排进复习队列');}
    startReview();});
}

/* 复制这件事有三种失败方式：非安全上下文下 navigator.clipboard 根本不存在、
   权限被拒、Promise 被拒。原来的写法只接了 .then()，三种都静默失败——
   用户点了「复制成绩单」，界面纹丝不动，也不知道该怎么办。
   兜底是把文本摊开让他自己选，这条路一定走得通。 */
function copyOut(text,what){
  const fallback=()=>{
    sheet(`<h3 class="sh-h">${ic('clip')} ${what}</h3>
      <p class="tip">这台设备不让网页写剪贴板。下面的文字可以长按 / 全选复制。</p>
      <textarea class="draft copyout" readonly>${text.replace(/</g,'&lt;')}</textarea>`);
    setTimeout(()=>{const t=document.querySelector('.copyout');if(t){t.focus();t.select();}},60);
  };
  try{
    if(!navigator.clipboard||!navigator.clipboard.writeText)return fallback();
    navigator.clipboard.writeText(text).then(()=>toast(what+'已复制'),fallback);
  }catch(e){fallback();}
}

function openSheet(dismissable){
  const sh=document.getElementById('sheet');
  /* 每个可关闭的抽屉都要有一个**看得见**的出口。原来唯一的出路是点上方
     那 20dvh 的遮罩，手机上没有任何提示——这就是断头路。 */
  if(dismissable&&!sh.querySelector('.sh-grab')){
    const g=document.createElement('button');
    g.className='sh-grab';g.type='button';
    g.setAttribute('aria-label','关闭');
    g.onclick=closeSheet;
    sh.insertBefore(g,sh.firstChild);
  }
  document.getElementById('scrim').classList.add('show');
  sh.classList.add('show');
  document.getElementById('scrim').onclick=dismissable?closeSheet:null;
  /* Esc 也要能退。键盘用户和外接键盘的平板用户没有遮罩可点。 */
  document.onkeydown=e=>{if(e.key==='Escape'&&dismissable)closeSheet();};
}
function closeSheet(){document.getElementById('scrim').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  document.onkeydown=null;
  /* 点遮罩关闭时也要通知开抽屉的人——否则质问台的 onClose 是死代码，
     退出质问后决策幕不会重画，「已质问 N 轮」这类状态就丢了。 */
  const cb=window.__sheetClose; window.__sheetClose=null; if(cb)cb();}
/* story.js 用：填内容并弹出；可选 keep=true 表示内容自带关闭逻辑 */
function sheet(html,keep){
  document.getElementById('sheet').innerHTML=html+(keep?'':`<button class="cta ghost" id="sh-x" style="margin-top:12px">关闭</button>`);
  openSheet(true);
  const x=document.getElementById('sh-x'); if(x)x.onclick=closeSheet;
}

function openNode(id){
  const n=byId[id];
  /* 硬边锁只在图谱页靠 disabled 拦着；幕结尾的「去练这条判据」是直接调进来的，
     于是第一幕读完就能被丢进未解锁的深层节点，那里的材料建立在还没学的前置上。
     锁应该由这里守——入口有几个都不漏。 */
  if(!n){toast('这一节还没有内容');return;}
  if(stateOf(n)==='locked'){
    const need=SITE.edges.filter(e=>e.to===n.id&&e.type==='hard')
      .map(e=>byId[e.from]).filter(x=>x&&!lit.has(x.id)).map(x=>x.name);
    toast(need.length?'先过「'+need.join('、')+'」':'这一节还没解锁');
    TAB='today';render();return;
  }
  const deep=isDeep(n);
  const mainQ=(n.screens||[]).filter(s=>s.quiz).map(s=>s.quiz);
  R={mode:'node',node:n,deep,step:0,steps:buildSteps(n,deep),
     cards:new Set(),ruleout:{},concl:null,conf:null,self:new Set(),
     quiz:mainQ[0]||null,quizIdx:0,mainQ,tried:new Set(),done:false,hint:0,t0:Date.now(),anchor:null};
  stage.classList.add('show');track('node_open',{node:id});drawStage();
}
function buildSteps(n,deep){
  const s=['material'];
  if(deep){s.push('write','cards');if((n.x_ruleout||[]).length)s.push('ruleout');}
  s.push('conclude');
  if(deep){s.push('self','review');}
  s.push('anchor');
  return s;
}
let _sy=null;
function drawStage(keepScroll){
  const _b=document.getElementById('stage-body'); _sy=_b?_b.scrollTop:null;
  const {node,steps,step}=R;
  document.getElementById('stage-prog').style.width=((step+1)/steps.length*100)+'%';
  document.getElementById('stage-n').textContent=(step+1)+'/'+steps.length;
  const b=document.getElementById('stage-body'),f=document.getElementById('stage-foot');
  const kind=steps[step];
  const H={material:mat,write:wr,cards:cd,ruleout:ro,conclude:cc,self:sf,review:rv,anchor:an}[kind];
  const out=H();
  b.innerHTML=out.body;f.innerHTML=out.foot;
  /* 换屏才归零。同屏状态更新（挑证据/排除辩护/标把握）要保住滚动位置，
     否则用户点一张卡就被弹回顶部，看不见自己刚点的那一项。 */
  b.scrollTop=(keepScroll&&_sy!=null)?_sy:0;
  out.bind&&out.bind();
  const nx=document.getElementById('st-next');
  if(nx)nx.onclick=()=>{R.step++;R.hint=0;drawStage();track('screen_view',{node:node.id,step:R.step});};
  const nq=document.getElementById('st-nextq');
  if(nq)nq.onclick=()=>{R.quizIdx++;R.quiz=R.mainQ[R.quizIdx];
    R.tried=new Set();R.done=false;R.conf=null;R.fb=null;R.cl=null;R.hint=0;R.t0=Date.now();drawStage();};
  const bk=document.getElementById('st-back');
  if(bk)bk.onclick=()=>{R.step--;drawStage();};
}
document.getElementById('stage-x').onclick=()=>{stage.classList.remove('show');R=null;render();flush();};

/* — 拍 1 材料 — */
function mat(){
  const n=R.node, cf=n.x_casefile;
  const scr=(n.screens||[]).filter(s=>!s.quiz);
  let body=`<div class="step-t">财报材料</div><h3>${nic(n.icon)} ${n.name}</h3>`;
  if(cf){                                   // ③ 材料优先，讲解按需
    body+=cfHTML(cf,{teach:scr.length>0});
  }else{                                    // 基础概念节点：仍走教学屏
    body+=scr.map(s=>`${s.h?`<h3 class="sh-h" style="margin-top:16px">${s.h}</h3>`:''}${s.body||''}`).join('');
  }
  if(n.canon)body+=`<div class="srcrow"><button class="src" id="st-canon">${canonLabel(n.canon.source)}</button></div>`;
  return{body,foot:`<button class="cta" id="st-next">${cf?'看完了，开始分析':'读完了，开始分析'}</button>`,
    bind(){
      const c=document.getElementById('st-canon');if(c)c.onclick=()=>showCanon(n);
      const tb=document.getElementById('cf-teach');
      if(tb)tb.onclick=()=>{document.getElementById('sheet').innerHTML=
        `<h3 class="sh-h">${ic('book')} 补课 · ${n.name}</h3>`+
        scr.map(s=>`${s.h?`<h4 class="sh-h4">${s.h}</h4>`:''}${s.body||''}`).join('')+
        `<button class="cta ghost" id="sh-x" style="margin-top:10px">看完了</button>`;
        openSheet(true);document.getElementById('sh-x').onclick=closeSheet;};
      SB().querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>showFact(b.dataset.src));
    }};
}
function showFact(fid){
  const f=(SITE.x_facts||{})[fid];
  document.getElementById('sheet').innerHTML=f?
    `<h3 class="sh-h">${ic('link')} 溯源</h3>
     <p class="sh-p"><b>${f.item}</b><br>${f.value}</p>
     <p class="tip">口径：${f.basis||'—'}<br>档案：${f.accession} · ${f.line}<br>公司：${f.company}</p>
     <p class="tip">这个数字不是我们写的，是从原始申报文件里取的——行号在上面，任何人都能复核。</p>
     <button class="cta ghost" id="sh-x">关闭</button>`
    :`<p class="sh-p">该数字的溯源条目未加载。</p><button class="cta ghost" id="sh-x">关闭</button>`;
  openSheet(true);document.getElementById('sh-x').onclick=closeSheet;
}
function showCanon(n){
  document.getElementById('sheet').innerHTML=`<h3 class="sh-h">${n.canon.term}</h3>
    <p class="sh-p">${n.canon.formal}</p>
    ${n.canon.house?`<div class="sh-h4">本站口径（这一段不是出处的话）</div><p class="sh-p">${n.canon.house}</p>`:''}
    <p class="tip">出处：${n.canon.source}${n.canon.x_cite?'<br>定位：'+n.canon.x_cite:''}${n.canon.textbook?'<br>体系位置：'+n.canon.textbook:''}</p>
    <button class="cta ghost" id="sh-x">关闭</button>`;
  openSheet(true);document.getElementById('sh-x').onclick=closeSheet;
}

/* — 拍 2 先写（纯本地，不上行） — */
function wr(){
  const q=R.mainQ[0];const k=DRAFT(q?q.x_id:R.node.id);
  const on=!!S.coachRead;
  const body=`<div class="step-t">第 ${R.steps.indexOf('write')} 步 · 先写</div>
    <p class="prompt">用一两句话说：你觉得可疑吗？凭什么？</p>
    <textarea class="draft" id="st-draft" placeholder="想到什么写什么，不判分。写完这一步的收益已经拿到了：研究里它是整套流程效应最稳的一环。"></textarea>
    <label class="opt-in"><input type="checkbox" id="st-read" ${on?'checked':''}>
      <span><b>让教练读一读，写回一段话</b><br>
      <span class="opt-in-w">${on
        ? `打开时，<b>这段文字会发到我们的服务器</b>交给 AI 读一遍，用来生成给你的回应。
           它<b>不影响判分</b>（对错仍由页面内置规则给），也不进你的成绩。随时可以关掉。`
        : `关着的时候，这段文字<b>只存在这台设备上</b>：不上传、不进记忆、不进 AI 的输入。
           下一步你会拿它和材料自己对照。`}</span></span></label>
    <div id="st-coachsay"></div>`;
  return{body,foot:`<div style="display:flex;gap:8px">
      <button class="cta ghost" id="st-skip" style="flex:0 0 40%">想不出来</button>
      <button class="cta" id="st-wdone">写好了</button></div>`,
    bind(){const t=document.getElementById('st-draft');
      try{t.value=localStorage.getItem(k)||'';}catch(e){}
      t.oninput=()=>{try{localStorage.setItem(k,t.value);}catch(e){}};
      document.getElementById('st-read').onchange=e=>{
        S.coachRead=e.target.checked;save();drawStage(1);};
      document.getElementById('st-skip').onclick=()=>{R.step++;drawStage();};
      /* 「写好了」不再直接翻页：先在原地把回应给出来。
         翻一页才看到反馈，那是交卷；就地看到，才像有人坐在旁边。 */
      /* 这颗按钮**不能叫 st-next**：drawStage 会在 bind() 之后把所有 st-next
         统一绑成「下一步」，把这里的处理器覆盖掉。同理容器不能叫 st-back，
         那个 id 已经是「上一步」按钮。两次碰撞都不会报错，只是行为静默变成别的。 */
      const nx=document.getElementById('st-wdone');
      nx.onclick=()=>{
        const txt=(t.value||'').trim();
        if(!txt||R.reviewed){R.step++;R.reviewed=false;drawStage();return;}
        R.reviewed=true;
        nx.disabled=true;
        coachRead(txt).then(()=>{
          const b=document.getElementById('st-wdone');
          if(b){b.disabled=false;b.textContent='继续';}
        });
      };}};
}

/* 教练读你写的那段推理，就地写回来。

   **降级路径是这套东西的前提**（ADR-0001 前置条件 4）：没开开关、没有后端、
   请求失败、或者服务端出口检查把回应丢了——任何一种情况都回落到本地反馈。
   本地反馈不上传、不需要网络，靠的是把你写的和这一关的证据卡做词面比对。
   它读不懂你写的话的含义，但它能看出你提没提某样东西，这已经比沉默强。 */
function coachRead(txt){
  const box=document.getElementById('st-coachsay');
  const cards=(R.node.x_cards||[]).filter(c=>c.role==='support');
  const local=()=>{
    const hit=cards.filter(c=>termsOf(c.t).some(w=>txt.includes(w)));
    const miss=cards.filter(c=>!hit.includes(c));
    let msg;
    if(!cards.length)msg='记下了。下一步你会看到这一关的材料，拿它对照你刚写的。';
    else if(!hit.length)msg=`你写的里面没有出现这一关的关键数字。下一步挑证据时留意：${termsOf(cards[0].t)[0]||'材料里的那几行'}。`;
    else if(!miss.length)msg='你把这一关的几条关键材料都提到了。下一步挑证据，看看你挑的和你写的对不对得上。';
    else msg=`你提到了 ${hit.length} 条关键材料，还有 ${miss.length} 条没出现在你的话里。下一步挑证据时会知道是哪几条。`;
    return {text:msg,src:'local'};
  };
  const render=r=>{
    if(!box)return;
    const tag=r.src==='llm'
      ?'<span class="llm-tag">【LLM教练说】</span>'
      :'<span class="llm-tag off">【LLM教练说 · 未连接，本地占位】</span>';
    box.innerHTML=`<div class="coach coach-back"><span class="w">${tag}</span><span>${r.text}</span>
      ${r.src==='local'?'<div class="tip">这条是这台设备上按规则算出来的，没有联网。接上后端并打开上面的开关，这一格才是模型读完你写的话之后写回来的。</div>':''}</div>`;
  };
  if(!S.coachRead||typeof BACKEND==='undefined'||!BACKEND){
    render(local());return Promise.resolve();
  }
  if(box)box.innerHTML='<div class="coach coach-back"><span class="w">你的教练：</span><span>在读你写的……</span></div>';
  /* 材料由前端给出：服务端保持无状态，且模型能引用的东西**只有我们给它的这些**。 */
  const material=[
    (R.node.canon||{}).formal||'',
    ...(R.node.evidence||[]),
    ...cards.map(c=>c.t),
    ...(R.node.x_ruleout||[]).map(x=>x.t||'')
  ].filter(Boolean).join('\n');
  return fetch(BACKEND+'/api/v1/review-note',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({device:S.device,node:R.node.id,note:txt,material})})
    .then(r=>r.json())
    .then(d=>{render(d&&d.text?{text:d.text,src:'llm'}:local());
      track('coach_read',{node:R.node.id,src:d&&d.text?'llm':'fallback'});})
    .catch(()=>{render(local());});
}

/* 从一条证据卡里取出可比对的词：数字、百分比、以及中文科目名。
   本地反馈靠它做词面比对——比不了含义，但比得了「提没提」。 */
function termsOf(t){
  const out=[];
  (t.match(/[+\-−]?\d+(?:[,.]\d+)*\s*[%倍天]?/g)||[]).forEach(x=>out.push(x.trim()));
  ['应收','收入','现金流','利润','存货','账期','毛利','净利'].forEach(w=>{if(t.includes(w))out.push(w);});
  return out;
}

/* — 拍 3 挑证据 — */
function cd(){
  const cards=R.node.x_cards||[];
  const body=`<div class="step-t">第 ${R.steps.indexOf('cards')} 步 · 挑证据</div>
    <p class="prompt">从材料里挑出你依据的那几条。挑对不挑多。</p>
    <div class="cards">${cards.map(c=>`<button class="card-c${R.cards.has(c.id)?' on':''}" data-c="${c.id}">${c.t}</button>`).join('')}</div>
    <div class="tip">已选 <b class="num" id="cnt">${R.cards.size}</b> 条。这一步不判对错，但它会成为你推理链的骨架。</div>`;
  return{body,foot:`<div style="display:flex;gap:8px">
      <button class="cta ghost" id="st-back" style="flex:0 0 30%">上一步</button>
      <button class="cta" id="st-next" ${R.cards.size?'':'disabled'}>选好了</button></div>`,
    bind(){SB().querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.c;R.cards.has(id)?R.cards.delete(id):R.cards.add(id);drawStage(1);});}};
}

/* — 拍 4 排除辩护词 — */
function ro(){
  const rs=R.node.x_ruleout||[];
  const L={excluded:'排除了',not_excluded:'没排除',insufficient:'材料不够'};
  const body=`<div class="step-t">第 ${R.steps.indexOf('ruleout')} 步 · 先替它辩护</div>
    <p class="prompt">这些是常见的无辜解释。逐条判：材料能不能排除它？</p>
    ${rs.map(r=>{const pick=R.ruleout[r.id];
      return `<div class="ro"><div class="t">${r.t}</div>
      <div class="opts">${Object.keys(L).map(v=>`<button data-r="${r.id}" data-v="${v}" class="${pick===v?'on':''}">${L[v]}</button>`).join('')}</div>
      ${pick?`<div class="fb">${pick===r.verdict?'✓ ':'△ '}${r.fb}</div>`:''}</div>`;}).join('')}`;
  const all=rs.every(r=>R.ruleout[r.id]);
  return{body,foot:`<div style="display:flex;gap:8px">
      <button class="cta ghost" id="st-back" style="flex:0 0 30%">上一步</button>
      <button class="cta" id="st-next" ${all?'':'disabled'}>判完了</button></div>`,
    bind(){SB().querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
      R.ruleout[b.dataset.r]=b.dataset.v;drawStage(1);});}};
}

/* — 拍 5 下结论（规则引擎判分） — */
function cc(){
  const q=R.quiz;
  if(!q)return{body:'<p>本节点无判定题。</p>',foot:`<button class="cta" id="st-next">继续</button>`};
  const needConf=!!q.confidence, picked=R.conf!=null;
  let body=`<div class="step-t">第 ${R.steps.indexOf('conclude')} 步 · 下结论${R.mainQ.length>1?`（${R.quizIdx+1}/${R.mainQ.length}）`:''}</div><p class="prompt">${q.q}</p>`;
  if(needConf){
    body+=`<div class="tip">先标注把握（进校准分，诚实最划算）：</div>
      <div class="seg">${CONF.map(c=>`<button data-cf="${c.v}" class="${R.conf===c.v?'on':''}" ${R.done?'disabled':''}>${c.t}</button>`).join('')}</div>`;
  }
  const lock=R.done||(needConf&&!picked);
  body+=shownOpts(q).map((o,i)=>{
    let cls='';
    if(R.done&&o.ok)cls=' right';else if(R.tried.has(i)&&!o.ok)cls=o.na?' naf':' wrong';
    return `<button class="opt${cls}" data-o="${i}" ${lock||R.tried.has(i)?'disabled':''}>${o.t}</button>`;}).join('');
  if(R.fb)body+=`<div class="fb${R.fbGood?' good':''}">${R.fb}</div>`;
  if(R.cl)body+=`<div class="coach"><span class="w">${R.cl.who}：</span><span>${R.cl.t}</span></div>`;
  if(!R.done&&(q.hints||[]).length){
    body+=`<button class="hintbtn" id="st-hint">${ic('bulb')} 提示（${R.hint}/${q.hints.length}）</button>`;
    if(R.hint)body+=`<div class="hintbox">${q.hints.slice(0,R.hint).map((h,i)=>`${'①②③'[i]} ${h}`).join('<br>')}</div>`;
  }
  const more=R.quizIdx<R.mainQ.length-1;
  return{body,foot:`<button class="cta" id="${more?'st-nextq':'st-next'}" ${R.done?'':'disabled'}>${more?'下一题':(R.deep?'继续':'去闭卷题')}</button>`,
    bind(){
      SB().querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{R.conf=+b.dataset.cf;drawStage(1);});
      const hb=document.getElementById('st-hint');
      if(hb)hb.onclick=()=>{if(R.hint<(q.hints||[]).length){R.hint++;S.hints++;save();}drawStage(1);};
      SB().querySelectorAll('[data-o]:not([disabled])').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.o,o=shownOpts(q)[i],first=!R.tried.size&&!S.answers[q.x_id];
        R.tried.add(i);
        if(o.ok){R.done=true;R.fb=q.fb;R.fbGood=true;R.concl=i;}
        else if(q.x_kind==='pretest'){R.done=true;R.fb=q.fb;R.fbGood=false;R.concl=i;}
        else{
          /* 答错时给的必须是**针对这个错误选项**的话。
             这里原先是全站同一句「不对——要不要点一级提示？」，而作者写的 q.fb
             只在答对时出现——最需要解释的人在那一刻什么也没拿到。

             o.why 说的是「你踩的是哪个误解」，**不给答案**：命名错误，然后让他再判一次。
             这比直接揭晓有用，也比一句通用话有用。没有 o.why 时退回原来的话。 */
          R.fb=o.why||(o.na?'这题的证据其实够了。回头看看材料，够在哪？':'不对。要不要看一级提示？');
          R.fbGood=false;
          /* 误解要能跨题聚合：同一个 mis 反复出现，说明不是手滑，是一个稳定的毛病。
             处方（prescribe）读它。 */
          if(o.mis){S.mis[o.mis]=(S.mis[o.mis]||0)+1;save();}
        }
        R.cl=line(o.na&&o.ok?'na_honest':o.na?'na_dodge':!o.ok&&R.conf===.95?'overconfident':!o.ok?'wrong':R.hint?'hint_used':'correct');
        if(first)recordFirst(q,{c:o.ok?1:0,na:o.na?1:0,naok:(o.na&&o.ok)?1:0,conf:R.conf,h:R.hint,
          k:q.x_kind||'main',ms:Date.now()-R.t0,noscore:NOSCORE.has(R.node.id)?1:0});
        drawStage(1);});}};
}
/* ① 系统主动触发：不摆「有问题问我」，由规则触发教练介入 */
function maybeIntervene(ctx){
  const c=coach();if(!c)return;
  let why=null,body=null;
  if(ctx.overconf){why='overconfident';
    body=`你刚才标了「很有把握」，但答错了。<b>这正是校准分要治的病</b>——不是知识不够，是把握感和证据不匹配。<br><br>
      下次遇到同类题，先问自己一句：我手上有几条相互独立的证据？只有一条的时候，「比较有把握」就够了。`;}
  else if(ctx.pairRepeat){const pm=PAIRS[ctx.pair];why='pair_repeat';
    body=`你在「${pm.look}」这个对上已经站错 <b>${ctx.wrong}</b> 次了。<br><br>
      区分线索就一句：<b>${pm.key}</b><br><br>这组易混概念会被排到你复习队列的最前面。`;}
  else if(ctx.anchorFail){why='wrong';
    body=`闭卷题没过——这一节不算通过。<br><br>这不是惩罚：闭卷题换了公司，考的是你能不能把方法搬到新材料上。回去把材料和证据链再走一遍，换一道闭卷题再来。`;}
  if(!why)return;
  const l=line(why);
  document.getElementById('sheet').innerHTML=
    `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
       <span class="ic-hero">${ic('coach')}</span><b class="sh-h">${coachName()}</b>
       <span class="tip" style="margin:0 0 0 auto">教练主动来找你</span></div>
     ${l?`<p class="sh-p lead">${l.t}</p>`:''}
     <p class="sh-p">${body}</p>
     <button class="cta ghost" id="sh-x">知道了</button>`;
  openSheet(true);document.getElementById('sh-x').onclick=closeSheet;
  track('coach_intervene',{why});
}

/* 记一次答错。**只有这一处累加 wrong。**

   原先三个地方各自 wrong++：recordFirst 内、锚题、复习。而后两处答完
   紧接着就调 recordFirst——同一次答错被记两次。又因为 recordFirst 开头有
   `if(S.answers[q.x_id])return` 守卫，只有首答会双计，于是表现成：
   第一次答错立刻显示「你已经站错 2 次」，pairRepeat 介入当场弹出。 */
function recordMiss(pid,side){
  if(!pid||!PAIRS[pid])return 0;
  const a=ensurePair(pid);
  a.wrong++;a.lastWrong=side||'node';
  return a.wrong;
}

function recordFirst(q,rec){
  if(S.answers[q.x_id])return;
  S.answers[q.x_id]=rec;
  if(q.confidence&&!rec.noscore){
    const na=(q.opts||[]).find(o=>o.na);
    if(na&&!na.ok){S.brave.n++;if(!rec.na)S.brave.dared++;}
    if(!(rec.na&&!rec.naok)){S.calib.n++;S.calib.sum+=Math.pow(rec.conf-(rec.c?1:0),2);}
    if(rec.conf===.95&&!rec.c&&!rec.na){S.calib.streak=0;S.calib.over++;}
    else if(rec.c){S.calib.streak++;S.calib.best=Math.max(S.calib.best,S.calib.streak);
      if(rec.conf===.55)S.calib.under++;}
  }
  let iv=null;
  if(q.confidence&&!rec.noscore&&rec.conf===.95&&!rec.c&&!rec.na)iv={overconf:1};
  if(q.x_pair&&PAIRS[q.x_pair]&&!rec.c&&!rec.na&&!rec.noscore){
    const r=recordMiss(q.x_pair,rec.side||'node');
    if(r>=2)iv={pairRepeat:1,pair:q.x_pair,wrong:r};}
  if(iv)setTimeout(()=>maybeIntervene(iv),650);
  track('first_answer',{quiz_id:q.x_id,pair_id:q.x_pair||null,side:rec.side||null,kind:rec.k,
    correct:rec.c,na:rec.na,conf:rec.conf||null,hints:rec.h,latency:rec.ms});
  save();
}

/* — 拍 6 自评对照（闭集，产生 hindsight gap） — */
function sf(){
  const sc=R.node.x_selfcheck||[];
  const body=`<div class="step-t">第 ${R.steps.indexOf('self')} 步 · 自评</div>
    <p class="prompt">诚实勾选：刚才分析时，你真的想到了哪几条？</p>
    ${sc.map(s=>`<button class="chk${R.self.has(s.id)?' on':''}" data-s="${s.id}">
      <span class="bx">${R.self.has(s.id)?'☑':'☐'}</span><span>${s.t}</span></button>`).join('')}
    <div class="tip">这一步不判分。它和你上一步实际挑的证据一对撞，就得到「事后诸葛率」——想到了但没写进链子的比例。</div>`;
  return{body,foot:`<button class="cta" id="st-next">对照专家链</button>`,
    bind(){SB().querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.s;R.self.has(id)?R.self.delete(id):R.self.add(id);drawStage(1);});}};
}

/* — 拍 7 批注回卷（四个可计算属性，规则引擎算） — */
function rv(){
  const n=R.node,cards=n.x_cards||[];
  const sup=cards.filter(c=>c.role==='support'), dis=cards.filter(c=>c.role!=='support');
  const hit=sup.filter(c=>R.cards.has(c.id)).length;
  const bad=dis.filter(c=>R.cards.has(c.id)).length;
  const cover=sup.length?Math.round(100*hit/sup.length):0;
  const roN=(n.x_ruleout||[]).length;
  const roOK=(n.x_ruleout||[]).filter(r=>R.ruleout[r.id]===r.verdict).length;
  const consist=R.conf==null?null:(R.conf>=.95&&hit<Math.ceil(sup.length*.6))?'偏高':(R.conf<=.55&&hit>=sup.length)?'偏低':'匹配';
  // hindsight gap：自评说想到了，但证据链里没有
  const scN=(n.x_selfcheck||[]).length;
  const gapN=Math.max(0,R.self.size-hit);
  if(!R.logged){S.gap.n+=R.self.size||0;S.gap.hits+=gapN;
    const st=S.steps[n.id]=S.steps[n.id]||{ev:{n:0,hit:0,bad:0},ro:{n:0,ok:0}};
    st.ev.n++;st.ev.hit+=hit;st.ev.bad+=bad;st.ro.n+=roN;st.ro.ok+=roOK;
    R.logged=true;track('step_review',{node:n.id,cover,bad,ro_ok:roOK,gap:gapN});save();}
  const body=`<div class="step-t">第 ${R.steps.indexOf('review')} 步 · 回顾</div>
    <p class="prompt">这不是分数，是关于你这次分析的四个事实。</p>
    <div class="attrs">
      <div class="attr"><div class="k">覆盖</div><div class="v num ${cover>=60?'g':'b'}">${cover}%</div></div>
      <div class="attr"><div class="k">干扰位</div><div class="v num ${bad?'b':'g'}">${bad} 条</div></div>
      <div class="attr"><div class="k">辩护词判准</div><div class="v num ${roN&&roOK===roN?'g':''}">${roN?roOK+'/'+roN:'—'}</div></div>
      <div class="attr"><div class="k">信心一致性</div><div class="v ${consist==='匹配'?'g':'b'}">${consist||'—'}</div></div>
    </div>
    ${bad?`<div class="fb">你挑进链子的「${dis.filter(c=>R.cards.has(c.id)).map(c=>c.t).join('、')}」不支撑结论——它要么是对手方也会有的特征，要么与判断无关。</div>`:''}
    ${gapN?`<div class="fb">事后诸葛：你自评说想到了 ${R.self.size} 条，但推理链里只落实了 ${hit} 条。<b>想到 ≠ 用上</b>——这一条不扣分，但它是判断力最常漏的地方。</div>`:''}
    <div class="fb good"><b>专家链（后置对照）</b><br>${sup.map((c,i)=>`${i+1}. ${c.t}`).join('<br>')}</div>
    <div class="tip">现在回头看看你在第 1 步写的那段话——你自己的推理和这条链差在哪？（那段话没有离开过你的手机）</div>
    ${coachHTML(cover>=60?'correct':'wrong')}`;
  return{body,foot:`<button class="cta" id="st-next">去做闭卷题</button>`};
}

/* — 锚题：唯一的点亮条件 — */
function an(){
  if(!R.anchor){
    const ids=(R.node.x_anchors||[]).filter(i=>BANKQ[i]);
    const seen=(S.anchors[R.node.id]||{}).seen||[];
    const fresh=ids.filter(i=>!seen.includes(i));
    const pool=fresh.length?fresh:ids;                     // 优先没见过的；用尽则轮换
    const pick=pool.length?pool[(S.anchors[R.node.id]?.attempts||0)%pool.length]:null;
    R.anchor=pick?{...BANKQ[pick]}:null;
    R.aTried=new Set();R.aDone=false;R.aPass=false;R.aConf=null;R.aFb=null;
  }
  if(!R.anchor&&(R.node.x_anchors||[]).length){            // 深层节点闭卷题池异常：绝不放行通过
    return{body:`<div class="step-t">闭卷题</div><h3>闭卷题暂不可用</h3>
      <p>这一节的闭卷题库有问题，这一节不会算通过——这是刻意的：<b>只有闭卷题能算通过</b>。请把这条报给我们。</p>`,
      foot:`<button class="cta ghost" id="st-retry">回去再练一遍</button>`,
      bind(){document.getElementById('st-retry').onclick=()=>{
        R.step=0;R.anchor=null;R.perm={};R.cards=new Set();R.ruleout={};R.self=new Set();R.logged=false;drawStage();};}};
  }
  if(!R.anchor){  // 基础节点（无 x_anchors）：结论即通过
    return{body:`<div class="step-t">收尾</div><h3>这一节没有闭卷题</h3>
      <p>基础概念节点走两拍。判完结论即可通过。</p>`,
      foot:`<button class="cta" id="st-light">${ic('spark')} 标记为已掌握</button>`,
      bind(){document.getElementById('st-light').onclick=()=>lightUp();}};
  }
  const q=R.anchor.quiz;
  let body=`<div class="step-t">闭卷题 · 换了一家公司</div>
    <p class="tip">这道题在刚才的分析里没出现过，也不给提示——<b>它是唯一能通过节点的一步</b>。答错不惩罚，回去再练就是。</p>
    <p class="prompt">${q.q}</p>
    <div class="seg">${CONF.map(c=>`<button data-af="${c.v}" class="${R.aConf===c.v?'on':''}" ${R.aDone?'disabled':''}>${c.t}</button>`).join('')}</div>`;
  const lock=R.aDone||R.aConf==null;
  body+=shownOpts(q).map((o,i)=>{
    let cls='';if(R.aDone&&o.ok)cls=' right';else if(R.aTried.has(i)&&!o.ok)cls=o.na?' naf':' wrong';
    return `<button class="opt${cls}" data-a="${i}" ${lock||R.aTried.has(i)?'disabled':''}>${o.t}</button>`;}).join('');
  if(R.aFb)body+=`<div class="fb${R.aPass?' good':''}">${R.aFb}</div>`;
  return{body,foot:R.aPass?`<button class="cta" id="st-light">${ic('spark')} 标记为已掌握</button>`
      :R.aDone?`<button class="cta ghost" id="st-retry">再练一遍这一节</button>`
      :`<button class="cta" disabled>先作答</button>`,
    bind(){
      SB().querySelectorAll('[data-af]').forEach(b=>b.onclick=()=>{R.aConf=+b.dataset.af;drawStage(1);});
      SB().querySelectorAll('[data-a]:not([disabled])').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.a,o=shownOpts(q)[i];R.aTried.add(i);
        const a=S.anchors[R.node.id]=S.anchors[R.node.id]||{attempts:0,seen:[]};
        a.attempts++;if(!a.seen.includes(R.anchor.quiz.x_id))a.seen.push(R.anchor.quiz.x_id);
        if(o.ok){R.aDone=true;R.aPass=true;R.aFb='✓ '+q.fb;a.passed_at=Date.now();}
        else{R.aDone=true;R.aPass=false;R.aFb=q.fb+'<br><br><b>这一节还没通过</b>——不扣分，回去把材料和证据链再走一遍，换一道闭卷题再来。';
          setTimeout(()=>maybeIntervene({anchorFail:1}),650);}
        if(R.anchor.pair){const p=ensurePair(R.anchor.pair);p.seen++;p.lastSide=R.anchor.side;
          if(o.ok){p.hl=Math.min(64,p.hl*2);p.lastWrong=null;}
          else{p.hl=Math.max(.5,p.hl/2);recordMiss(R.anchor.pair,R.anchor.side);}
          p.due=Date.now()+p.hl*DAY;}
        recordFirst(q,{c:o.ok?1:0,na:o.na?1:0,naok:(o.na&&o.ok)?1:0,conf:R.aConf,h:0,k:'anchor',
          side:R.anchor.side,ms:0,noscore:0});
        track('anchor_answer',{node:R.node.id,quiz_id:q.x_id,correct:o.ok?1:0,attempts:a.attempts});
        save();drawStage(1);});
      const rt=document.getElementById('st-retry');
      if(rt)rt.onclick=()=>{R.step=0;R.anchor=null;R.cards=new Set();R.ruleout={};R.self=new Set();R.logged=false;drawStage();};
      const lb=document.getElementById('st-light');
      if(lb)lb.onclick=()=>lightUp();}};
}
function lightUp(){
  const n=R.node;lit.add(n.id);save();track('node_lit',{node:n.id});
  const unlocked=SITE.nodes.filter(x=>!lit.has(x.id)&&stateOf(x)==='open').map(x=>x.name);
  const done=lit.size===SITE.nodes.length;
  if(done&&!S.finished){S.finished=Date.now();save();track('chapter_complete',{});}
  document.getElementById('stage-body').innerHTML=
    `<div class="endpad"><div class="pop-ic">${nic(n.icon)}</div>
      <h3>「${n.name}」已通过</h3>
      <p class="tip">${R.aPass
        ? '你是靠一道闭卷题通过的的——不是靠看完材料。'
        : '这一节是基础概念，没有闭卷题；判完结论即可通过。<b>后面的节点要过闭卷题才算。</b>'}</p>
      ${unlocked.length?`<p>新的材料已开放：${unlocked.join('、')}</p>`:''}
      ${done?`<div class="fb good">第一章全部通过。接下来靠复习维持——它比新课更能说明你学会了没有。</div>`:''}
      ${coachHTML(done?'complete':'streak')}</div>`;
  document.getElementById('stage-foot').innerHTML=`<button class="cta" id="st-done">回到今日</button>`;
  document.getElementById('stage-prog').style.width='100%';
  document.getElementById('st-done').onclick=()=>{stage.classList.remove('show');R=null;render();flush();};

/* ============ ② 时事案卷（实验室，不计分） ============ */
/* ============ 近期财报实验区 ============

   **这一区能做而已结案案例做不到的，是「在真实不确定性下判过程」。**

   已结案的案例可以告诉你判对没判对：答案在档里。时事案例没人能这么告诉你，
   所以照抄那套判分是错的——这里原先只问「这是哪种形状」，而形状就印在上一屏的
   note 里，等于把答案送出去，考的东西已结案案例也全考过。

   现在换成：读完数字，问「你接下来会去查什么」。这件事**可以确定性地判**：
   哪些问题一份年报答得了、哪些答不了，与这家公司最后是好是坏无关。
   而这正是 checklist-after 教的东西唯一能在真实材料上做的迁移测试。

   四条边界不变：不进错题档案、不进复习队列、不计校准分、不能让任何一节算通过。
   但**不计分不等于不观察**：反复跳过现金流验证是一条正当的诊断，它进处方。 */

/* 信号 → 这份材料答得了的问题。跟代码一起版本化，不做字符串匹配。 */
const LAB_ACT = [
  {id:'cash-flow', t:'查现金流量表：利润有没有变成现金',
   by:['ar-outpaces-rev','ni-positive-ocf-negative'], teach:'corroborate'},
  {id:'terms', t:'读附注里的账期与信用政策，看条款有没有变',
   by:['ar-outpaces-rev','dso-lengthening'], teach:'dso'},
  {id:'concentration', t:'查客户集中度披露，是不是集中到了少数几家',
   by:['ar-outpaces-rev'], teach:'rf1'},
  {id:'acquisition', t:'查有没有并购并表，两期口径可不可比',
   by:['ar-outpaces-rev','dso-lengthening'], teach:'falsification'},
  {id:'gap-where', t:'查缺口沉在哪个科目（应收 / 存货 / 应付）',
   by:['ni-positive-ocf-negative'], teach:'rf2'},
  {id:'rev-policy', t:'读附注的收入确认政策，看它按什么时点确认',
   by:['ar-outpaces-rev','dso-lengthening','ni-positive-ocf-negative'], teach:'find-filings'},
  {id:'letter', t:'读监管的问询函原文和公司的回复', by:['@letter'], teach:null},
  /* 越界项：**不是荒谬选项**，是散户真会选的下一步，而它们要么这份材料答不了、
     要么根本不是判断财报的动作。这一屏最要紧的教学就在这里。 */
  {id:'price', t:'看它最近的股价走势', out:'股价不回答「这些数字是怎么来的」'},
  {id:'target', t:'看券商研报给的目标价', out:'别人的结论替代不了你自己读材料'},
  {id:'call', t:'打电话问公司管理层', out:'散户拿不到这个通道，而且当事人的说法本身要被核对'},
  {id:'wait', t:'先不管，等下一季财报再看', out:'疑点不会因为等待而消解，能查的现在就能查'},
];

function labCases(){return ((SITE.x_lab||{}).cases)||[];}
function labNext(){return labCases().find(c=>!((S.lab||{})[c.id]));}

function openLab(id){
  const cs=labCases();
  const lc=id?cs.find(c=>c.id===id):labNext();
  if(!lc)return toast('实验区暂时没有新的一卷');
  R={mode:'lab',case:lc,step:0,picked:new Set(),done:false};
  stage.classList.add('show');track('lab_open',{case:lc.id});drawLab();
}

/* 这一卷该查什么：由管线算出的 signals 决定，不是人手挑的。 */
function labWanted(lc){
  const sig=new Set(lc.signals||[]);
  if(lc.letter)sig.add('@letter');
  return LAB_ACT.filter(a=>a.by&&a.by.some(x=>sig.has(x)));
}

function drawLab(){
  const lc=R.case, cs=labCases(), idx=cs.indexOf(lc)+1;
  document.getElementById('stage-prog').style.width=(R.step?100:50)+'%';
  document.getElementById('stage-n').textContent=(R.step+1)+'/2';
  const b=SB(),f=document.getElementById('stage-foot');
  if(R.step===0){
    b.innerHTML=`<div class="step-t">近期财报 · 实验区 · 第 ${idx} / ${cs.length} 卷</div>${cfHTML(lc,{})}
      <p class="cfnote">这一卷的边界：<b>只读数字的形状，不对这家公司下任何定性判断</b>。
      下一屏问的不是「它有没有问题」，而是<b>你接下来会去查什么</b>。</p>`;
    f.innerHTML=`<button class="cta" id="lab-next">看完了</button>`;
    b.querySelectorAll('[data-src]').forEach(x=>x.onclick=()=>showFact(x.dataset.src));
    document.getElementById('lab-next').onclick=()=>{R.step=1;drawLab();};
    return;
  }
  const want=labWanted(lc), wid=new Set(want.map(a=>a.id));
  let h=`<div class="step-t">下一步查什么 · 判过程，不判这家公司</div>
    <p class="prompt">这些数字摆在你面前。接下来你会去查什么？可以多选。</p>`;
  h+=LAB_ACT.map(a=>{
    let c='';
    if(R.done)c=R.picked.has(a.id)?(wid.has(a.id)?' right':' wrong')
                                  :(wid.has(a.id)?' naf':'');
    else if(R.picked.has(a.id))c=' on';
    return `<button class="card-c${c}" data-la="${a.id}" ${R.done?'disabled':''}>${a.t}</button>`;
  }).join('');
  if(R.done){
    const hit=want.filter(a=>R.picked.has(a.id));
    const miss=want.filter(a=>!R.picked.has(a.id));
    const over=LAB_ACT.filter(a=>a.out&&R.picked.has(a.id));
    h+=`<div class="fb${over.length?'':' good'}">
      这份材料答得了 ${want.length} 个问题，你选中了 ${hit.length} 个。
      ${miss.length?`没选的：${miss.map(a=>a.t).join('；')}。`:'一个没漏。'}
      ${over.length?`<br><br>另外这几条这份材料答不了：${
        over.map(a=>`「${a.t}」${a.out}`).join('；')}。`:''}</div>
    <div class="cfnote">这一屏判的是**过程**，不是这家公司是好是坏。
      它不进错题档案、不进复习队列、不计校准分、不能让任何一节算通过。<br>
      管线：${lc.provenance.computed_by}<br>取数标签：${
      Object.values(lc.provenance.tags||{}).join(' / ')}</div>`;
  }
  b.innerHTML=h;
  const more=labNext()&&labNext()!==lc;
  f.innerHTML=R.done
    ? `<div style="display:flex;gap:8px">${more?'<button class="cta" id="lab-more">下一卷</button>':''}
       <button class="cta${more?' ghost':''}" id="lab-x">回到今日</button></div>`
    : `<div style="display:flex;gap:8px">
       <button class="cta ghost" id="lab-x" style="flex:0 0 40%">先不做</button>
       <button class="cta" id="lab-go" ${R.picked.size?'':'disabled'}>就查这些</button></div>`;
  b.querySelectorAll('[data-la]:not([disabled])').forEach(x=>x.onclick=()=>{
    const id=x.dataset.la;
    R.picked.has(id)?R.picked.delete(id):R.picked.add(id);
    drawLab();});
  const go=document.getElementById('lab-go');
  if(go)go.onclick=()=>{
    R.done=true;
    S.lab=S.lab||{};S.lab[lc.id]=1;
    /* **不计分不等于不观察。** 屏上承诺的四条是「不进错题档案、不进复习、
       不计校准分、不能让任何一节算通过」——记一条「他跳过了现金流验证」
       不属于这四条里的任何一条，而它是一条正当的诊断。处方会读它。 */
    S.labproc=S.labproc||{skipped:{},over:{}};
    labWanted(lc).forEach(a=>{if(!R.picked.has(a.id))
      S.labproc.skipped[a.id]=(S.labproc.skipped[a.id]||0)+1;});
    LAB_ACT.forEach(a=>{if(a.out&&R.picked.has(a.id))
      S.labproc.over[a.id]=(S.labproc.over[a.id]||0)+1;});
    save();track('lab_process',{case:lc.id,picked:[...R.picked].join(','),
      want:labWanted(lc).length});
    drawLab();};
  const mb=document.getElementById('lab-more');
  if(mb)mb.onclick=()=>{const n=labNext();stage.classList.remove('show');R=null;
    if(n)openLab(n.id);else{render();}};
  document.getElementById('lab-x').onclick=()=>{
    stage.classList.remove('show');R=null;render();flush();};
}

function startReview(){
  const dues=duePairs();if(!dues.length)return toast('没有到期的复习 ✓');
  R={mode:'review',queue:dues.map(p=>{const a=ensurePair(p);
      /* 先补上次答错的那一面；答对之后 lastWrong 会被清空（见 recordMiss 的对侧），
         于是转为与上次不同的一面。lastWrong 一度从不清空，结果是某一面错过一次之后
         **永远只出这一面**——混淆对的双面训练从此再没发生过，而它的全部意义
         就是你得能区分 a 和 b。 */
      let side=a.lastWrong==='a'||a.lastWrong==='b'?a.lastWrong:(a.lastSide==='a'?'b':'a');
      if(!BANK[p][side]||!BANK[p][side].length)side=side==='a'?'b':'a';
      const list=BANK[p][side];return{pid:p,side,quiz:list[a.seen%list.length]};}),
     qi:0,tried:new Set(),done:false,conf:null,fb:null,ok:0};
  S.reviews++;save();track('review_start',{n:dues.length});
  stage.classList.add('show');drawReview();
}
function drawReview(){
  const it=R.queue[R.qi];
  const b=document.getElementById('stage-body'),f=document.getElementById('stage-foot');
  document.getElementById('stage-prog').style.width=((R.qi+(R.done?1:0))/R.queue.length*100)+'%';
  document.getElementById('stage-n').textContent=(R.qi+1)+'/'+R.queue.length;
  if(!it){
    /* 做完一轮之后，把「还练不练」交回给用户。
       DESIGN.md §2 说的是「不要把队列摊平成菜单让他挑」——那是讲**默认**该由产品编排。
       它不等于练完一轮还不许他自己要下一道。想多练一道的人是这个产品最该留住的人。 */
    const more=extraDrill();
    b.innerHTML=`<div class="endpad"><div class="pop-ic">${ic('repeat')}</div>
      <h3>复习完成 ${R.ok}/${R.queue.length}</h3>
      <p class="tip">答对的下次来得更晚，答错的很快再见。</p>
      ${more?`<p class="tip">还想练的话，这里有一道${more.why}。</p>`:''}</div>`;
    f.innerHTML=(more?`<button class="cta" id="rv-more">再来一道</button>`:'')
      +`<button class="cta${more?' ghost':''}" id="rv-x">${more?'今天到此':'回到今日'}</button>`;
    document.getElementById('rv-x').onclick=()=>{stage.classList.remove('show');R=null;render();flush();};
    if(more)document.getElementById('rv-more').onclick=()=>{
      R.queue.push(more.item);R.qi=R.queue.length-1;
      R.tried=new Set();R.done=false;R.conf=null;R.fb=null;R.cl=null;R.perm={};
      track('extra_drill',{pair_id:more.item.pid});drawReview();};
    return;
  }
  const q=it.quiz,pm=PAIRS[it.pid];
  let body=`<div class="step-t">复习 · 闭卷</div>
    <h3 class="sh-h">${ic('repeat')} ${pm?pm.look:it.pid}</h3>
    <p class="prompt">${q.q}</p>
    <div class="seg">${CONF.map(c=>`<button data-cf="${c.v}" class="${R.conf===c.v?'on':''}" ${R.done?'disabled':''}>${c.t}</button>`).join('')}</div>`;
  const lock=R.done||R.conf==null;
  body+=shownOpts(q).map((o,i)=>{let cls='';
    if(R.done&&o.ok)cls=' right';else if(R.tried.has(i)&&!o.ok)cls=o.na?' naf':' wrong';
    return `<button class="opt${cls}" data-o="${i}" ${lock||R.tried.has(i)?'disabled':''}>${o.t}</button>`;}).join('');
  if(R.fb)body+=`<div class="fb${R.fbGood?' good':''}">${R.fb}</div>`;
  if(R.cl)body+=`<div class="coach"><span class="w">${R.cl.who}：</span><span>${R.cl.t}</span></div>`;
  b.innerHTML=body;b.scrollTop=0;
  f.innerHTML=`<button class="cta" id="rv-next" ${R.done?'':'disabled'}>${R.qi+1===R.queue.length?'完成':'下一道'}</button>`;
  SB().querySelectorAll('[data-cf]').forEach(x=>x.onclick=()=>{R.conf=+x.dataset.cf;drawReview();});
  SB().querySelectorAll('[data-o]:not([disabled])').forEach(x=>x.onclick=()=>{
    const i=+x.dataset.o,o=shownOpts(q)[i];R.tried.add(i);
    if(o.ok){R.done=true;R.fb=q.fb;R.fbGood=true;R.ok++;}
    else{R.done=true;R.fb=(o.why?o.why+'<br><br>':'')+q.fb;R.fbGood=false;
      if(o.mis){S.mis[o.mis]=(S.mis[o.mis]||0)+1;}}
    R.cl=line(o.na&&o.ok?'na_honest':!o.ok?'pair_repeat':'correct');
    const a=ensurePair(it.pid);a.seen++;a.lastSide=it.side;
    if(o.ok){a.hl=Math.min(64,a.hl*2);a.lastWrong=null;}
    else{a.hl=Math.max(.5,a.hl/2);recordMiss(it.pid,it.side);}
    a.due=Date.now()+a.hl*DAY;
    recordFirst(q,{c:o.ok?1:0,na:o.na?1:0,naok:(o.na&&o.ok)?1:0,conf:R.conf,h:0,k:'review',side:it.side,ms:0,noscore:0});
    track('review_answer',{quiz_id:q.x_id,pair_id:it.pid,side:it.side,correct:o.ok?1:0});
    save();drawReview();});
  document.getElementById('rv-next').onclick=()=>{R.qi++;R.tried=new Set();R.done=false;R.conf=null;R.fb=null;R.cl=null;drawReview();};
}

/* ============ 成绩单 ============ */
function scorecard(){
  const dur=Math.round(((S.finished||Date.now())-S.started)/6e4);
  const pl={v:2,site:SITE.id,cv:SITE.x_version||'',lit:lit.size,total:SITE.nodes.length,acc:acc(),
    brier:brier(),brave:braveRate(),hints:S.hints,reviews:S.reviews,
    over:S.calib.over,gap:S.gap.n?Math.round(100*S.gap.hits/S.gap.n):null,min:dur,done:S.finished?1:0};
  return `投资教练 · ${SITE.tag}成绩单
进度 ${lit.size}/${SITE.nodes.length}${S.finished?'（已完成）':''} ｜ 首答正确率 ${acc()==null?'—':acc()+'%'} ｜ 校准分 ${brier()==null?'—':brier()+'/100'} ｜ 下结论率 ${braveRate()==null?'—':braveRate()+'%'}
提示 ${S.hints} 次 ｜ 复习 ${S.reviews} 轮 ｜ 过度自信 ${S.calib.over} 次 ｜ 用时约 ${dur} 分钟
（教学复盘，非投资建议）
IC2|${btoa(unescape(encodeURIComponent(JSON.stringify(pl))))}`;
}

let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800);}
render();track('session_start',{});
if(!S.coach)S.coach='risk';   // 默认语气；不是身份，用户可在「你的教练」里改
save();
if(/MicroMessenger/i.test(navigator.userAgent))
  setTimeout(()=>toast('微信里可能清掉进度：建议右上角「用浏览器打开」'),1200);
window.addEventListener('beforeunload',()=>{track('session_end',{});flush();});
